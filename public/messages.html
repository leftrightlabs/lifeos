<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LRL OS · Messages</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/cards.css">
<script defer src="/cards.js"></script>
<script defer src="/zone-scope.js"></script>
<style>
:root { --zone: var(--accent); --zone-soft: var(--accent-soft); --r:8px; --rs:5px; }
.msg-zone { max-width: 920px; margin: 0 auto; padding-bottom: 90px; font-size: 14px; line-height: 1.45; }

/* source tabs */
.source-tabs { display:flex; padding:0 20px; border-bottom:1px solid var(--border); background:var(--surface-2); overflow-x:auto; scrollbar-width:none; }
.source-tabs::-webkit-scrollbar { display:none; }
.src-tab { display:flex; align-items:center; gap:7px; padding:12px 16px 11px; border:none; background:transparent; color:var(--text-3); font-size:13px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .18s; white-space:nowrap; font-family:inherit; }
.src-tab:hover { color:var(--text-2); }
.src-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.src-tab .src-icon { width:15px; height:15px; flex-shrink:0; }
.cnt { min-width:18px; height:18px; border-radius:9px; padding:0 5px; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; }
.cnt.red { background:var(--red); } .cnt.amber { background:var(--amber); color:#0A0F1E; } .cnt.work { background:var(--work); } .cnt.none { display:none; }

/* toolbar */
.toolbar { display:flex; align-items:center; gap:8px; padding:10px 20px 9px; border-bottom:1px solid var(--border-soft); }
.f-pill { padding:4px 12px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:12px; font-weight:500; transition:all .15s; font-family:inherit; }
.f-pill:hover { border-color:var(--text-4); color:var(--text-2); }
.f-pill.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.f-pill.important-pill.active { background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
.toolbar-right { margin-left:auto; display:flex; gap:6px; }
.triage-btn { padding:4px 11px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:12px; font-weight:500; transition:all .15s; font-family:inherit; }
.triage-btn:hover { border-color:var(--accent); color:var(--accent); }

/* bulk bar */
.bulk-bar { display:none; align-items:center; gap:10px; padding:9px 20px; background:var(--accent-soft); border-bottom:1px solid rgba(99,102,241,.25); }
.bulk-bar.show { display:flex; }
.bulk-count { font-size:13px; font-weight:600; color:var(--accent); }
.bulk-btn { padding:4px 10px; border-radius:var(--rs); border:1px solid rgba(99,102,241,.25); background:transparent; color:var(--text-2); font-size:12px; font-weight:500; transition:all .15s; font-family:inherit; }
.bulk-btn:hover { background:var(--accent-soft); color:var(--accent); }
.bulk-btn.danger:hover { background:var(--red-soft); border-color:rgba(242,109,109,.3); color:var(--red); }
.bulk-spacer { flex:1; }

/* section heads */
.section-head { display:flex; align-items:center; gap:10px; padding:10px 20px 6px; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.section-head::after { content:''; flex:1; height:1px; }
.section-head.urgent { color:var(--amber); } .section-head.urgent::after { background:var(--amber-soft); }
.section-head.normal { color:var(--text-4); } .section-head.normal::after { background:var(--border-soft); }
.inbox-meta { display:flex; align-items:center; justify-content:space-between; padding:9px 20px 5px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-4); }

/* message row */
.msg-row { display:flex; align-items:flex-start; padding:11px 20px 11px 16px; border-bottom:1px solid var(--border-soft); cursor:pointer; position:relative; overflow:hidden; transition:background .12s; border-left:3px solid transparent; user-select:none; }
.msg-row:hover { background:var(--surface-2); }
.msg-row.selected { background:var(--accent-soft); }
.msg-row.unread { border-left-color:var(--accent); }
.msg-row.needs-attention { border-left-color:var(--amber); }
.msg-row.needs-attention.unread { border-left-color:var(--red); }
.msg-cb { width:18px; height:18px; flex-shrink:0; border:2px solid var(--border); border-radius:4px; margin-right:10px; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .15s; font-size:11px; color:transparent; }
.msg-row:hover .msg-cb, .msg-row.selected .msg-cb { border-color:var(--accent); background:var(--accent-soft); }
.msg-row.selected .msg-cb { color:var(--accent); }
.msg-av { width:36px; height:36px; border-radius:50%; flex-shrink:0; margin-right:11px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; position:relative; }
.msg-av.vip::after { content:''; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--amber); }
.msg-body { flex:1; min-width:0; }
/* Title (sender) wraps instead of truncating. */
.msg-sender { font-size:13px; font-weight:600; color:var(--text); line-height:1.3; overflow-wrap:anywhere; }
.msg-row:not(.unread) .msg-sender { font-weight:500; color:var(--text-2); }
.msg-subject { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:2px 0 0; }
.msg-row:not(.unread) .msg-subject { color:var(--text-2); font-weight:400; }
/* Meta line: short preview + age + work/personal icon + send-to-tasks icon. */
.msg-meta { display:flex; align-items:center; gap:8px; margin-top:4px; }
.msg-preview { font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.msg-time { flex-shrink:0; font-size:11px; color:var(--text-3); }
.msg-row.unread .msg-time { color:var(--accent); font-weight:600; }
.msg-cat-ic { flex-shrink:0; display:inline-flex; }
.msg-cat-ic svg { width:14px; height:14px; display:block; }
.msg-cat-ic.work { color:var(--work); } .msg-cat-ic.personal { color:var(--personal); }
.msg-todo { flex-shrink:0; background:none; border:none; padding:1px; color:var(--text-4); cursor:pointer; display:inline-flex; line-height:1; }
.msg-todo:hover { color:var(--accent); }
.msg-todo svg { width:16px; height:16px; display:block; }
.msg-tag { font-size:10px; font-weight:800; padding:2px 6px; border-radius:3px; text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; white-space:nowrap; }
.msg-tag.personal { background:var(--personal-soft); color:var(--personal); }
.msg-tag.work2 { background:var(--work-soft); color:var(--work); }
.msg-tag.reply { background:var(--amber-soft); color:var(--amber); }

/* New Task modal (opened from a row's clipboard icon) */
.task-modal { position:fixed; inset:0; background:rgba(5,8,14,.78); backdrop-filter:blur(4px); display:none; align-items:flex-start; justify-content:center; padding:56px 18px; z-index:400; overflow-y:auto; }
.task-modal.open { display:flex; }
.tm-content { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; max-width:520px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.6); }
.tm-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.tm-title { font-size:20px; font-weight:800; color:var(--text); }
.tm-close { background:none; border:1px solid var(--border); color:var(--text-3); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; line-height:1; }
.tm-close:hover { color:var(--text); }
.tm-seg { display:inline-flex; gap:8px; margin-bottom:16px; }
.tm-seg button { background:var(--surface-2); border:1px solid var(--border); color:var(--text-3); font-family:inherit; font-size:13px; font-weight:600; padding:7px 18px; border-radius:999px; cursor:pointer; transition:all .15s; }
.tm-seg button.active { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.tm-field { margin-bottom:14px; }
.tm-field label { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
.tm-field input, .tm-field select, .tm-field textarea { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-family:inherit; font-size:14px; color:var(--text); }
.tm-field textarea { resize:vertical; min-height:54px; }
.tm-field input:focus, .tm-field select:focus, .tm-field textarea:focus { outline:none; border-color:var(--accent); }
.tm-2col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tm-check { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-2); margin-bottom:14px; cursor:pointer; }
.tm-check input { width:18px; height:18px; accent-color:var(--accent); }
.tm-clear { float:right; background:none; border:none; color:var(--text-3); font-size:11px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; font-weight:700; }
.tm-clear:hover { color:var(--text); }
.tm-actions { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid var(--border-soft); }
.tm-btn { padding:10px 18px; border-radius:8px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; border:1px solid transparent; }
.tm-btn.ghost { background:none; border-color:var(--border); color:var(--text-2); }
.tm-btn.ghost:hover { color:var(--text); border-color:var(--text-3); }
.tm-btn.primary { background:var(--accent); color:#fff; }
.tm-btn.primary:hover { filter:brightness(1.1); }
.hover-acts { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; gap:3px; opacity:0; pointer-events:none; background:var(--surface); padding:3px 5px; border-radius:var(--rs); border:1px solid var(--border); transition:opacity .15s; }
.msg-row:hover .hover-acts { opacity:1; pointer-events:all; }
.hact { width:28px; height:28px; border-radius:4px; border:none; background:transparent; color:var(--text-3); font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .1s; }
.hact:hover { background:var(--surface-2); color:var(--text); } .hact.del:hover { color:var(--red); }
.msg-row.swiping-right { background:var(--green-soft) !important; }
.msg-row.swiping-left { background:var(--amber-soft) !important; }

/* slack */
.channel-group { border-bottom:1px solid var(--border); }
.channel-head { display:flex; align-items:center; gap:8px; padding:9px 20px 7px; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-4); background:var(--surface-2); border-bottom:1px solid var(--border-soft); }
.slack-msg { display:flex; align-items:flex-start; gap:11px; padding:10px 20px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .12s; }
.slack-msg:hover { background:var(--surface-2); } .slack-msg:last-child { border-bottom:none; }
.slack-msg.unread { border-left:3px solid var(--work); padding-left:17px; }
.slack-av { width:32px; height:32px; border-radius:6px; flex-shrink:0; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.slack-meta { flex:1; min-width:0; }
.slack-top { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
.slack-name { font-size:13px; font-weight:600; color:var(--text); }
.slack-time { margin-left:auto; font-size:11px; color:var(--text-3); flex-shrink:0; }
.slack-text { font-size:13px; color:var(--text-2); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.slack-at { color:var(--accent); font-weight:500; }

/* notion */
.notion-comment { display:flex; align-items:flex-start; gap:11px; padding:13px 20px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .12s; }
.notion-comment:hover { background:var(--surface-2); }
.notion-comment.unread { border-left:3px solid var(--accent); padding-left:17px; }
.notion-av { width:34px; height:34px; border-radius:50%; flex-shrink:0; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.notion-meta { flex:1; min-width:0; }
.notion-page-chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; background:var(--surface); border:1px solid var(--border); color:var(--text-3); margin-bottom:5px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notion-top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.notion-name { font-size:12px; font-weight:600; color:var(--text-2); }
.notion-time { margin-left:auto; font-size:11px; color:var(--text-3); }
.notion-text { font-size:13px; color:var(--text-2); line-height:1.4; }
.notion-mention { color:var(--accent); font-weight:500; }
.n-archive { background:none; border:1px solid var(--border); border-radius:5px; color:var(--text-3); font-size:11px; font-weight:600; padding:2px 8px; margin-left:8px; cursor:pointer; flex-shrink:0; transition:all .15s; font-family:inherit; }
.n-archive:hover { border-color:var(--accent); color:var(--accent); }
.archive-all { background:none; border:1px solid var(--border); border-radius:20px; color:var(--text-3); font-size:11px; font-weight:600; padding:3px 12px; cursor:pointer; font-family:inherit; transition:all .15s; }
.archive-all:hover { border-color:var(--accent); color:var(--accent); }

/* empty / skeleton / error */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px; color:var(--text-4); text-align:center; gap:8px; }
.empty-icon { font-size:40px; } .empty-title { font-size:15px; font-weight:600; color:var(--text-3); } .empty-body { font-size:13px; max-width:340px; }
.empty .btn-connect { margin-top:8px; padding:8px 16px; border-radius:20px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; font-family:inherit; }
.sk-row { display:flex; gap:11px; padding:13px 20px; border-bottom:1px solid var(--border-soft); }
.sk { background:var(--surface-2); border-radius:4px; animation:sk 1.5s ease infinite; }
.sk-av { width:36px; height:36px; border-radius:50%; flex-shrink:0; }
.sk-line { height:9px; margin-bottom:7px; } .sk-sm { width:35%; } .sk-md { width:60%; } .sk-lg { width:85%; }
@keyframes sk { 0%,100%{opacity:1} 50%{opacity:.45} }

/* detail panel */
.detail-overlay { position:fixed; inset:0; z-index:200; background:rgba(5,8,14,.72); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); display:flex; justify-content:flex-end; opacity:0; pointer-events:none; transition:opacity .22s; }
.detail-overlay.open { opacity:1; pointer-events:all; }
.detail-panel { width:560px; max-width:100vw; height:100%; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .26s cubic-bezier(.4,0,.2,1); }
.detail-overlay.open .detail-panel { transform:translateX(0); }
.dp-hdr { display:flex; align-items:flex-start; gap:10px; padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top)); border-bottom:1px solid var(--border); flex-shrink:0; }
.dp-close { width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-2); color:var(--text-2); font-size:17px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.dp-close:hover { background:var(--border); color:var(--text); }
.dp-subject-wrap { flex:1; min-width:0; }
.dp-subject { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; margin-bottom:5px; }
.dp-badges { display:flex; flex-wrap:wrap; gap:5px; }
.dp-navs { display:flex; gap:4px; flex-shrink:0; }
.dp-nav-btn { width:28px; height:28px; border-radius:var(--rs); border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.dp-nav-btn:hover { background:var(--surface-2); color:var(--text); }
.dp-meta { display:flex; align-items:center; gap:11px; padding:11px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
.dp-av { width:38px; height:38px; border-radius:50%; flex-shrink:0; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.dp-meta-text { flex:1; min-width:0; }
.dp-from { font-size:13px; font-weight:600; color:var(--text); }
.dp-email { font-size:11px; color:var(--text-3); margin-top:1px; }
.dp-date { font-size:11px; color:var(--text-3); flex-shrink:0; }
.dp-body { flex:1; overflow-y:auto; padding:20px; }
.dp-body-text { font-size:14px; line-height:1.65; color:var(--text); word-wrap:break-word; }
.dp-body-text p { margin-bottom:10px; } .dp-body-text a { color:var(--accent); text-decoration:underline; }
.dp-body-text img { max-width:100%; height:auto; margin:8px 0; }
.dp-body-text h1,.dp-body-text h2,.dp-body-text h3,.dp-body-text h4,.dp-body-text h5,.dp-body-text h6 { font-family:var(--font-display); font-weight:700; line-height:1.25; margin:18px 0 8px; color:var(--text); }
.dp-body-text h1 { font-size:20px; } .dp-body-text h2 { font-size:18px; } .dp-body-text h3 { font-size:16px; } .dp-body-text h4,.dp-body-text h5,.dp-body-text h6 { font-size:14px; }
.dp-body-text ul,.dp-body-text ol { margin:0 0 10px 20px; } .dp-body-text li { margin-bottom:4px; }
.dp-body-text blockquote { border-left:3px solid var(--border); margin:0 0 10px; padding:2px 0 2px 14px; color:var(--text-2); }
.dp-body-text hr { border:none; border-top:1px solid var(--border); margin:18px 0; }
.dp-body-text table { border-collapse:collapse; max-width:100%; } .dp-body-text td,.dp-body-text th { padding:4px 8px; text-align:left; vertical-align:top; }
.dp-iframe { width:100%; border:none; display:block; background:#fff; border-radius:10px; min-height:200px; }
.dp-plain { white-space:pre-wrap; word-break:break-word; }
.open-external { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:var(--rs); border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:12px; font-weight:500; text-decoration:none; transition:all .15s; margin-top:16px; }
.open-external:hover { border-color:var(--accent); color:var(--accent); }
.dp-acts { display:flex; justify-content:space-around; align-items:center; gap:4px; padding:6px 4px; padding-bottom:max(8px, env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.dp-act-btn { background:transparent; border:none; cursor:pointer; color:var(--text-3); padding:10px 18px; border-radius:10px; display:flex; align-items:center; justify-content:center; transition:color .15s, background .15s; }
.dp-act-btn svg { width:22px; height:22px; display:block; }
.dp-act-btn:hover { color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); }
.dp-act-btn.active { color:var(--accent); }
.dp-act-btn.danger:hover { color:var(--red); background:var(--red-soft); }
.dp-btn { display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:var(--rs); border:1px solid var(--border); background:transparent; color:var(--text-2); font-size:12px; font-weight:500; transition:all .15s; white-space:nowrap; font-family:inherit; }
.dp-btn:hover { background:var(--surface-2); color:var(--text); border-color:var(--text-4); }
.dp-btn.primary { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.dp-btn.primary:hover { background:var(--accent); color:#fff; }
.dp-btn.danger:hover { background:var(--red-soft); border-color:rgba(242,109,109,.3); color:var(--red); }
.dp-sep { width:1px; height:20px; background:var(--border); margin:0 2px; }

/* reply composer */
.reply-box { border-top:1px solid var(--border); background:var(--surface-2); flex-shrink:0; display:none; }
.reply-box.open { display:block; }
.reply-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 14px 0; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); }
.reply-x { width:22px; height:22px; border:none; background:transparent; color:var(--text-3); font-size:16px; line-height:1; }
.reply-x:hover { color:var(--text); }
.reply-ta { width:100%; min-height:90px; max-height:200px; background:transparent; border:none; outline:none; color:var(--text); font-size:13px; line-height:1.55; padding:10px 14px; resize:none; font-family:inherit; }
.reply-ta::placeholder { color:var(--text-4); }
.ai-loading-row { display:none; align-items:center; gap:8px; padding:6px 14px; font-size:12px; color:var(--accent); }
.ai-loading-row.show { display:flex; }
.dots { display:flex; gap:3px; } .dots span { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:bounce 1.1s ease-in-out infinite; }
.dots span:nth-child(2){animation-delay:.18s} .dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce { 0%,80%,100%{transform:scale(.8);opacity:.4} 40%{transform:scale(1.2);opacity:1} }
.reply-toolbar { display:flex; align-items:center; gap:6px; padding:7px 14px 11px; }
.ai-gen-btn { display:flex; align-items:center; gap:5px; padding:6px 13px; border-radius:20px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; transition:all .15s; font-family:inherit; }
.ai-gen-btn:hover { background:var(--accent); color:#fff; } .ai-gen-btn:disabled { opacity:.45; pointer-events:none; }
.send-btn { display:flex; align-items:center; gap:5px; padding:6px 15px; border-radius:20px; border:none; background:var(--accent); color:#fff; font-size:12px; font-weight:600; margin-left:auto; transition:all .15s; font-family:inherit; }
.send-btn:hover { filter:brightness(1.1); }

/* snooze + toast */
.snooze-overlay { position:fixed; inset:0; z-index:300; background:rgba(5,8,14,.85); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .18s; }
.snooze-overlay.open { opacity:1; pointer-events:all; }
.snooze-panel { width:280px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.snooze-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:14px; }
.snooze-opt { display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:var(--rs); cursor:pointer; transition:background .12s; margin-bottom:3px; }
.snooze-opt:hover { background:var(--surface-2); }
.snooze-opt-label { font-size:13px; color:var(--text); } .snooze-opt-time { font-size:11px; color:var(--text-3); }
.snooze-cancel { width:100%; margin-top:10px; padding:8px; border:1px solid var(--border); border-radius:var(--rs); background:transparent; color:var(--text-3); font-size:12px; font-family:inherit; transition:all .15s; }
.snooze-cancel:hover { color:var(--text); border-color:var(--text-4); }
.toast-wrap { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none; }
.toast { padding:9px 16px; border-radius:20px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.45); animation:toastIn .2s ease; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
#msg-error { display:none; margin:14px 20px; background:var(--red-soft); border:1px solid rgba(242,109,109,.25); color:var(--red); border-radius:var(--r); padding:12px 16px; font-size:13px; }
#msg-error button { margin-left:10px; background:transparent; border:1px solid var(--red); color:var(--red); border-radius:var(--rs); padding:3px 10px; font-size:12px; font-family:inherit; cursor:pointer; }

@media (max-width:600px) { .detail-panel { width:100vw; } .hover-acts { display:none; } }
</style>

</head><body>
<div id="lrl-shell"></div>

<div class="msg-zone">
  <h1 class="page-title" style="padding:18px 20px 12px">Messages</h1>
  <div class="source-tabs">
    <button class="src-tab active" data-tab="gmail" onclick="switchTab('gmail')">
      <svg class="src-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Gmail <span class="cnt red none" id="g-cnt"></span>
    </button>
    <button class="src-tab" data-tab="slack" onclick="switchTab('slack')">
      <svg class="src-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 15a2 2 0 1 1 0-4h2v4H6zm0-6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm8-2a2 2 0 1 1 4 0 2 2 0 0 1-4 0zm-2 0H8V5h4v2zm2 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-2h-4v-4h4v4zm2-6a2 2 0 1 1 0 4h-2V9h2z"/></svg>
      Slack <span class="cnt work none" id="s-cnt"></span>
    </button>
    <button class="src-tab" data-tab="notion" onclick="switchTab('notion')">
      <svg class="src-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279V8.87l-1.215-.14c-.093-.514.28-.888.747-.933z"/></svg>
      Notion <span class="cnt none" id="n-cnt"></span>
    </button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="f-pill active" onclick="setFilter('all',this)">All</button>
    <button class="f-pill" onclick="setFilter('unread',this)">Unread</button>
    <button class="f-pill important-pill" onclick="setFilter('important',this)">⚑ Needs Attention</button>
    <div class="toolbar-right"><button class="triage-btn" id="sel-all-btn" onclick="selectAll()">☐ Select all</button></div>
  </div>

  <div class="bulk-bar" id="bulk-bar">
    <span class="bulk-count" id="bulk-cnt">0 selected</span>
    <button class="bulk-btn" onclick="bulkArchive()">Archive</button>
    <button class="bulk-btn" onclick="bulkMarkRead()">Mark read</button>
    <button class="bulk-btn danger" onclick="bulkDelete()">Delete</button>
    <div class="bulk-spacer"></div>
    <button class="bulk-btn" onclick="clearSel()">✕ Cancel</button>
  </div>

  <div id="msg-error"></div>

  <div id="tab-gmail">
    <div class="inbox-meta"><span id="inbox-label">INBOX</span><span id="account-label"></span></div>
    <div id="gmail-list"></div>
  </div>
  <div id="tab-slack" style="display:none"><div id="slack-list"></div></div>
  <div id="tab-notion" style="display:none"><div id="notion-list"></div></div>
</div>

<div class="detail-overlay" id="detail-overlay" onclick="maybeCloseDetail(event)">
  <div class="detail-panel">
    <div class="dp-hdr">
      <button class="dp-close" onclick="closeDetail()">✕</button>
      <div class="dp-subject-wrap"><div class="dp-subject" id="dp-subject">—</div><div class="dp-badges" id="dp-badges"></div></div>
      <div class="dp-navs"><button class="dp-nav-btn" onclick="navMsg(-1)">▲</button><button class="dp-nav-btn" onclick="navMsg(1)">▼</button></div>
    </div>
    <div class="dp-meta">
      <div class="dp-av" id="dp-av">?</div>
      <div class="dp-meta-text"><div class="dp-from" id="dp-from">—</div><div class="dp-email" id="dp-email">—</div></div>
      <div class="dp-date" id="dp-date">—</div>
    </div>
    <div class="dp-body" id="dp-body"><div class="dp-body-text" id="dp-body-text"></div></div>
    <div class="reply-box" id="reply-box">
      <div class="reply-hdr"><span>↩ Reply</span><button class="reply-x" onclick="closeReply()">✕</button></div>
      <textarea class="reply-ta" id="reply-ta" placeholder="Write your reply…"></textarea>
      <div class="ai-loading-row" id="ai-loading"><div class="dots"><span></span><span></span><span></span></div> Generating with AI…</div>
      <div class="reply-toolbar">
        <button class="ai-gen-btn" id="ai-btn" onclick="genReply()">✨ Generate reply</button>
        <button class="dp-btn" onclick="closeReply()">Discard</button>
        <button class="send-btn" onclick="sendReply()">Send ↗</button>

    </div>
    <div class="dp-acts" id="dp-acts">
      <button class="dp-act-btn danger" onclick="deleteDetail()" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      </button>
      <button class="dp-act-btn" onclick="archiveDetail()" title="Archive" aria-label="Archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
      </button>
      <button class="dp-act-btn" onclick="openReply()" title="Reply" aria-label="Reply">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>
      </button>
      <button class="dp-act-btn" onclick="snoozeDetail()" title="Snooze" aria-label="Snooze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      </button>
      <button class="dp-act-btn" onclick="taskFromDetail()" title="Create Notion task" aria-label="Create Notion task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="snooze-overlay" id="snooze-overlay">
  <div class="snooze-panel">
    <div class="snooze-title">⏰ Snooze until…</div>
    <div class="snooze-opt" onclick="doSnooze('1h')"><span class="snooze-opt-label">In 1 hour</span><span class="snooze-opt-time" id="sz-1h">—</span></div>
    <div class="snooze-opt" onclick="doSnooze('3h')"><span class="snooze-opt-label">In 3 hours</span><span class="snooze-opt-time" id="sz-3h">—</span></div>
    <div class="snooze-opt" onclick="doSnooze('tomorrow-am')"><span class="snooze-opt-label">Tomorrow morning</span><span class="snooze-opt-time">8:00 AM</span></div>
    <div class="snooze-opt" onclick="doSnooze('tomorrow-pm')"><span class="snooze-opt-label">Tomorrow afternoon</span><span class="snooze-opt-time">2:00 PM</span></div>
    <div class="snooze-opt" onclick="doSnooze('next-week')"><span class="snooze-opt-label">Next week</span><span class="snooze-opt-time">Mon 8:00 AM</span></div>
    <button class="snooze-cancel" onclick="closeSnooze()">Cancel</button>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- New Task modal — opened from a row's clipboard icon, prefilled from the email -->
<div class="task-modal" id="taskModal" onclick="if(event.target===this)closeTaskModal()">
  <div class="tm-content">
    <div class="tm-head"><div class="tm-title">New Task</div><button class="tm-close" onclick="closeTaskModal()" aria-label="Close">×</button></div>

      </select></div>

<a href="/" class="fab" title="Back to Today">⚡</a>

<script>
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function relTime(ms){ if(!ms) return ''; const d=Date.now()-ms; const m=Math.round(d/60000); if(m<1)return'now'; if(m<60)return m+'m'; const h=Math.round(m/60); if(h<24)return h+'h'; return Math.round(h/24)+'d'; }
function initials(n){ return String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?'; }
const AVC = ['#6366F1','#2563EB','#06B6D4','#059669','#D97706','#DC2626','#7C3AED','#DB2777'];
function avColor(n){ let h=0; for(const c of String(n||'')) h=(h*31+c.charCodeAt(0))&0xffffffff; return AVC[Math.abs(h)%AVC.length]; }
// Notion URL → notion:// deep link so it opens in the Notion desktop/mobile app.
function toNotionLink(url){ if(!url) return url; const m=url.match(/([a-f0-9]{32})/i); if(m) return `notion://www.notion.so/${m[1]}`; if(url.startsWith('https://www.notion.so/')) return url.replace('https://','notion://'); if(url.startsWith('https://app.notion.com/')) return url.replace('https://app.notion.com/','notion://www.notion.so/'); return url; }
function openNotionLink(url){ if(window.openNotion){ window.openNotion(url); return false; } const link=toNotionLink(url); if(link&&link.startsWith('notion://')){ window.location.href=link; } else { window.open(url,'_blank','noopener'); } return false; }

const state = { tab:'gmail', filter:'all', mode:'all', selected:new Set(), openId:null, openSrc:null,
  cache:{ gmail:{data:[],t:0}, slack:{data:null,t:0}, notion:{data:[],t:0} } };

/* WORK / ALL / PERSONAL — Gmail is split by category; Slack & Notion are work
   tools, so they're hidden in PERSONAL mode. The shared shell (shell.js) owns
   the mode toggle and calls this hook whenever the mode changes (and once on
   load), so this page just re-renders its content for the new mode. */
window.onShellModeChange = function(m){ state.mode = m; render(); updateBadges(); };
function modeGmail(m){ if(state.mode==='work') return m.cat!=='PERSONAL'; if(state.mode==='personal') return m.cat==='PERSONAL'; return true; }
function modeHidesWorkSource(){ return state.mode==='personal'; }
function workSourceEmpty(label){ return `<div class="empty"><div class="empty-icon">💼</div><div class="empty-title">Work only</div><div class="empty-body">${label} is a work tool — switch to WORK or ALL to see it.</div></div>`; }
const TTL = 60000;
let detail = null; // full open message (with messageId/references for reply)

/* snooze (client-side, localStorage) */
function snoozeStore(){ try { return JSON.parse(localStorage.getItem('lrl-msg-snooze')||'{}'); } catch { return {}; } }
function isSnoozed(id){ const s=snoozeStore()[id]; return s && s>Date.now(); }
function setSnooze(id, until){ try { const s=snoozeStore(); s[id]=until; localStorage.setItem('lrl-msg-snooze', JSON.stringify(s)); } catch {} }
/* Notion archive — dismiss handled comments from this page (Notion's API has no
   read/resolve state, so we track dismissals locally). */
function nArchiveStore(){ try { return JSON.parse(localStorage.getItem('lrl-msg-notion-archived')||'[]'); } catch { return []; } }
function isNotionArchived(id){ return nArchiveStore().includes(id); }
function addNotionArchive(ids){ try { const s=new Set(nArchiveStore()); (Array.isArray(ids)?ids:[ids]).forEach(i=>s.add(i)); localStorage.setItem('lrl-msg-notion-archived', JSON.stringify([...s])); } catch {} }
function restoreNotionArchive(){ try { localStorage.removeItem('lrl-msg-notion-archived'); } catch {} state.cache.notion.t=0; loadTab('notion'); toast('↩ Restored archived comments'); }

function toast(msg){ const w=document.getElementById('toast-wrap'); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; w.appendChild(t); setTimeout(()=>t.remove(),2800); }
function showError(msg){ const e=document.getElementById('msg-error'); e.style.display='block'; e.innerHTML=esc(msg)+' <button onclick="reloadTab()">Retry</button>'; }
function clearError(){ document.getElementById('msg-error').style.display='none'; }

/* ── tabs / filters ── */
function switchTab(t){ state.tab=t;
  document.querySelectorAll('.src-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  document.getElementById('tab-gmail').style.display = t==='gmail'?'':'none';
  document.getElementById('tab-slack').style.display = t==='slack'?'':'none';
  document.getElementById('tab-notion').style.display = t==='notion'?'':'none';
  document.getElementById('toolbar').style.display = t==='notion'?'none':'';
  clearSel(); closeDetail(); clearError(); loadTab(t);
}
function setFilter(f, btn){ state.filter=f; document.querySelectorAll('.f-pill').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function reloadTab(){ const c=state.cache[state.tab]; if(c) c.t=0; loadTab(state.tab); }

/* ── data loading ── */
function skeleton(el){ el.innerHTML = Array.from({length:5}).map(()=>`<div class="sk-row"><div class="sk sk-av"></div><div style="flex:1"><div class="sk sk-line sk-sm"></div><div class="sk sk-line sk-lg"></div><div class="sk sk-line sk-md"></div></div></div>`).join(''); }

async function loadTab(tab){
  const c = state.cache[tab];
  if (c.data && (tab==='slack'? c.data!=null : c.data.length) && Date.now()-c.t < TTL) { render(); return; }
  const listEl = document.getElementById(tab==='gmail'?'gmail-list':tab==='slack'?'slack-list':'notion-list');
  skeleton(listEl);
  try {
    if (tab==='gmail') {
      const r = await fetch('/api/comms/gmail?status=all&days=30'); const d = await r.json();
      if (d.error) throw new Error(d.error);
      c.data = (d.threads||[]).map(t=>({ id:t.id, account:t.account, threadId:t.threadId, from:t.fromName, email:t.fromEmail,
        subject:t.subject, preview:t.snippet, cat:t.category||'WORK', time:relTime(t.internalDate), unread:t.unread,
        needsReply:t.needsReply, isVIP:t.isVIP, url:t.url, archived:false, deleted:false })).filter(m=>!isSnoozed(m.id));
    } else if (tab==='slack') {
      const r = await fetch('/api/messages/slack'); c.data = await r.json();
    } else {
      const r = await fetch('/api/messages/notion-comments'); const d = await r.json();
      if (d.error) throw new Error(d.error);
      c.data = (d.comments||[]).filter(m=>!isSnoozed(m.id) && !isNotionArchived(m.id));
    }
    c.t = Date.now(); clearError(); render();
  } catch (e) { showError("Couldn't load "+tab+": "+e.message); }
}

/* ── render ── */
function importantGmail(m){ return m.isVIP || m.needsReply; }
function render(){ if(state.tab==='gmail') renderGmail(); else if(state.tab==='slack') renderSlack(); else renderNotion(); updateBadges(); }

function renderGmail(){
  const all = state.cache.gmail.data || [];
  const inMode = all.filter(m=>!m.archived&&!m.deleted&&modeGmail(m));
  const visible = inMode.filter(m=>{ if(state.filter==='unread') return m.unread; if(state.filter==='important') return importantGmail(m); return true; });
  const imp = visible.filter(importantGmail), normal = visible.filter(m=>!importantGmail(m));
  let html='';
  if (imp.length){ html += `<div class="section-head urgent">⚑ Needs Attention &nbsp;(${imp.length})</div>` + imp.map(gmailRow).join(''); }
  if (normal.length && state.filter!=='important'){ if(imp.length) html += `<div class="section-head normal">Other &nbsp;(${normal.length})</div>`; html += normal.map(gmailRow).join(''); }
  if (!visible.length) html = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">All clear</div><div class="empty-body">Nothing matches this filter.</div></div>`;
  document.getElementById('gmail-list').innerHTML = html;
  document.getElementById('inbox-label').textContent = `INBOX (${inMode.length})`;
  const p = inMode.filter(m=>m.cat==='PERSONAL').length;
  document.getElementById('account-label').textContent = `${p} PERSONAL · ${inMode.length-p} WORK`;
}
// Work/personal icon (matches the mode toggle). Shown only in ALL mode — it's
// redundant when you're already filtered to work or personal.
function catIconHtml(cat){
  if (state.mode !== 'all') return '';
  const personal = cat === 'PERSONAL';
  const path = personal
    ? '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>'
    : '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>';
  return `<span class="msg-cat-ic ${personal?'personal':'work'}" title="${personal?'Personal':'Work'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>`;
}

function gmailRow(m){
  const col=avColor(m.from), sel=state.selected.has(m.id);
  let cls='msg-row'; if(m.unread)cls+=' unread'; if(importantGmail(m))cls+=' needs-attention'; if(sel)cls+=' selected';
  const reply = m.needsReply ? `<span class="msg-tag reply">Needs Reply</span>` : '';
  const todoIc = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="m9 13 2 2 4-4"/></svg>`;

    const gmailLink = `<a class="open-external" href="${esc(m.url)}" target="_blank">↗ Open in Gmail</a>`;
    if (d.bodyHtml) {
      // Render the real HTML email in a sandboxed iframe so it looks exactly as

      bodyEl.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.className = 'dp-iframe';
      // allow-same-origin (but NOT allow-scripts) lets us measure the content
      // height to auto-size the frame; email scripts still never run.
      iframe.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
      iframe.srcdoc = `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6;color:#1a2340;background:#fff;padding:16px 18px;margin:0;word-break:break-word}a{color:#2563EB}img{max-width:100%;height:auto}pre,code{font-size:12px;background:#f4f4f4;padding:2px 4px;border-radius:3px}</style></head><body>${d.bodyHtml}</body></html>`;
      bodyEl.appendChild(iframe);
      // Re-measure as images/fonts load so the whole email shows (a single
      // measure on load fires before images settle, cutting the body short).
      const fitIframe = () => { try { const h = iframe.contentDocument.body.scrollHeight; if (h) iframe.style.height = (h + 24) + 'px'; } catch(_) {} };
      iframe.addEventListener('load', () => {
        fitIframe();
        try {
          const doc = iframe.contentDocument;
          doc.querySelectorAll('img').forEach(img => { if (!img.complete) { img.addEventListener('load', fitIframe, { once:true }); img.addEventListener('error', fitIframe, { once:true }); } });
          if (window.ResizeObserver) new ResizeObserver(fitIframe).observe(doc.body);
        } catch(_) {}
        [150, 500, 1200].forEach(t => setTimeout(fitIframe, t));   // safety re-measures
      });
      bodyEl.insertAdjacentHTML('beforeend', gmailLink);
    } else {
      const text = d.bodyText ? `<div class="dp-plain">${esc(d.bodyText)}</div>` : '<p>(no content)</p>';
      bodyEl.innerHTML = text + gmailLink;
    }
  } catch(e){ document.getElementById('dp-body-text').innerHTML = `<p style="color:var(--red)">Couldn't load message: ${esc(e.message)}</p>`; }
}

/* ── minimal HTML sanitizer (no library) ── */
function sanitize(html){
  const allowed = new Set(['P','BR','B','I','EM','STRONG','U','UL','OL','LI','A','BLOCKQUOTE','DIV','SPAN',
    'H1','H2','H3','H4','H5','H6','HR','IMG','FIGURE','FIGCAPTION','TABLE','THEAD','TBODY','TR','TD','TH']);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,head,title').forEach(n=>n.remove());
  const walk = (node) => {
    [...node.children].forEach(el=>{
      walk(el);
      if (!allowed.has(el.tagName)) { el.replaceWith(...el.childNodes); return; }
      if (el.tagName==='IMG'){
        // Keep only an https/data src; drop everything else and make it responsive.
        const src = el.getAttribute('src') || '';
        [...el.attributes].forEach(a=>el.removeAttribute(a.name));
        if (/^(https:|data:image\/)/i.test(src)) { el.setAttribute('src', src); el.setAttribute('loading','lazy'); el.setAttribute('style','max-width:100%;height:auto;border-radius:8px'); }
        else { el.remove(); }
        return;
      }
      [...el.attributes].forEach(a=>{ const ok = el.tagName==='A' && a.name==='href' && /^(https?:|mailto:)/i.test(a.value); if(!ok) el.removeAttribute(a.name); });
      if (el.tagName==='A'){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener'); }
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}

let tx0=0,ty0=0,trow=null;
document.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; trow=e.target.closest('.msg-row'); },{passive:true});
document.addEventListener('touchmove',e=>{ if(!trow)return; const dx=e.touches[0].clientX-tx0, dy=e.touches[0].clientY-ty0; if(Math.abs(dy)>Math.abs(dx)){trow=null;return;} trow.classList.toggle('swiping-right',dx>30); trow.classList.toggle('swiping-left',dx<-30); },{passive:true});
document.addEventListener('touchend',e=>{ if(!trow)return; trow.classList.remove('swiping-right','swiping-left'); const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0; if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)){trow=null;return;} const id=trow.dataset.id; if(dx>0) archiveMsg(id); else snoozeMsg(id,null); trow=null; },{passive:true});

/* ── keyboard ── */
document.addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){ if(document.getElementById('snooze-overlay').classList.contains('open')) closeSnooze(); else closeDetail(); return; }
  if(!state.openId) return; const k=e.key.toLowerCase();
  if(k==='e'){ archiveDetail(); e.preventDefault(); } if(k==='#'){ deleteDetail(); e.preventDefault(); }
  if(k==='r'){ openReply(); e.preventDefault(); } if(k==='s'){ snoozeDetail(); e.preventDefault(); }
  if(k==='arrowdown'){ navMsg(1); e.preventDefault(); } if(k==='arrowup'){ navMsg(-1); e.preventDefault(); }
});

/* ── init: preload all three so badges populate ── */
loadTab('gmail');
fetch('/api/messages/slack').then(r=>r.json()).then(d=>{ state.cache.slack.data=d; state.cache.slack.t=Date.now(); updateBadges(); }).catch(()=>{});
fetch('/api/messages/notion-comments').then(r=>r.json()).then(d=>{ state.cache.notion.data=(d.comments||[]).filter(m=>!isSnoozed(m.id)&&!isNotionArchived(m.id)); state.cache.notion.t=Date.now(); updateBadges(); }).catch(()=>{});
</script>
