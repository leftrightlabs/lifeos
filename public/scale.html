<script>
let DATA = null;
// Global ME toggle (shell.js): keep items assigned to me, plus unassigned ones.
// Issues carry `assigned` (name) + `mine`; rocks carry `owner` (name) + `mine`.
function scaleMine(x){ return !(window.LRLShell && LRLShell.meMode()) || x.mine || !(x.assigned || x.owner); }
window.onMeModeChange = function(){ if (DATA) renderAll(DATA); };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const money = (v) => v == null ? '—' : (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString();
const moneyK = (v) => { if (v == null) return '—'; const a = Math.abs(v); const s = v < 0 ? '−$' : '$'; return a >= 1000 ? s + (a/1000).toFixed(a >= 10000 ? 0 : 1) + 'k' : s + Math.round(a); };
const num = (v) => v == null ? '—' : Math.round(v).toLocaleString();
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2400); }

const CUR_SOURCES = ['Xero Revenue','Xero Profit','Convert Deals Won'];
function fmtMetricVal(m){
  const f=(v)=> v==null?'—': CUR_SOURCES.includes(m.source)? moneyK(v) : (m.source==='Xero Cash Capacity'? (Math.round(v*100)/100).toFixed(2) : num(v));
  return `${f(m.actual)} <span class="g">/ ${f(m.goal)}</span>`;
}
const barColor=(s)=> s==='green'?'var(--green)': s==='amber'?'var(--amber)': s==='red'?'var(--red)':'var(--text-4)';
const valClass=(s)=> s==='green'?'c-green': s==='amber'?'c-amber': s==='red'?'c-red':'c-unknown';
const HEALTH_BADGE={ 'Solid':'b-solid','Functional':'b-functional','Needs Review':'b-needs-rev','Needs Build':'b-needs-build','Broken':'b-broken','Missing':'b-missing' };
const healthBadge=(h)=> h?`<span class="badge ${HEALTH_BADGE[h]||'b-neutral'}">${esc(h)}</span>`:'';
const prioBadge=(p)=>{ const c= p==='URGENT'?'b-urgent': p==='HIGH'?'b-amber':'b-normal'; return `<span class="badge ${c}">${esc(p||'NORMAL')}</span>`; };
const sysPrioBadge=(p)=>{ const c= p==='Critical'?'b-urgent': p==='High'?'b-amber':'b-neutral'; return p?`<span class="badge ${c}">${esc(p)}</span>`:''; };
function maturityDots(n){ n=n||0; let h=''; for(let i=0;i<5;i++){ h+=`<div class="md ${i<n?(n<=2?'mid':'on'):''}"></div>`; } return `<div class="md-dots">${h}</div>`; }
function relDate(d){ if(!d) return null; const days=Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(new Date().toISOString().slice(0,10)+'T00:00:00Z'))/864e5); if(days===0)return'today'; if(days===1)return'tomorrow'; if(days<0)return `${-days}d overdue`; return `in ${days}d`; }

const ROCK_BORDER={ complete:'l-green', onTrack:'l-green', atRisk:'l-amber', offTrack:'l-red', notStarted:'l-gray' };
const ROCK_BADGE={ complete:['✓ COMPLETE','b-solid'], onTrack:['ON TRACK','b-on-track'], atRisk:['AT RISK','b-amber'], offTrack:['OFF TRACK','b-urgent'], notStarted:['NOT STARTED','b-neutral'] };
const rockBarColor=(s)=> (s==='offTrack')?'var(--red)':(s==='atRisk')?'var(--amber)':(s==='notStarted')?'var(--text-4)':'var(--green)';

function showTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  try { localStorage.setItem('scale-tab', name); } catch {}
}
// Restore the last tab the user was on (persists across leaving + returning to Scale).
function restoreScaleTab(){
  let t; try { t = localStorage.getItem('scale-tab'); } catch {}
  if (t && document.getElementById('tab-'+t)) showTab(t);
}

// ── PULSE ──
// Wrap a list section in a shared collapsible card (title inside, count on right).
function scCard(title, body, opts){
  opts = opts || {};
  const count = opts.count != null ? `<span class="eyebrow-count ${opts.tone||''}">${opts.count}</span>` : '';
  const action = opts.action || '';
  const key = opts.key ? ` data-persist-key="${opts.key}"` : '';
  return `<div class="t-card"${key}><div class="sec-head"><div class="card-toggle" onclick="toggleCard(this)"><span class="chev">▾</span><div class="sec-title">${title}</div></div><div class="sec-head-right">${action}${count}</div></div><div class="t-body">${body}</div></div>`;
}

function renderPulse(d){
  const calm = d.state==='calm';
  const flags = d.pulse?.autoFlags||[];
  const issues = (d.pulse?.teamIssues||[]).filter(scaleMine);
  const hero = d.pulse?.heroIssue;
  let h='';

  // state banner
  if(calm){
    h += `<div class="statebanner"><span class="bigicon">✓</span><div class="txt"><h2 class="scotch">The machine is running</h2><p>Scorecard on track · ${issues.length} planning item${issues.length===1?'':'s'} · all critical systems healthy.</p></div></div>`;
  } else {
    const parts=[];
    if(d.scorecard?.offTrackCount) parts.push(`${d.scorecard.offTrackCount} metric${d.scorecard.offTrackCount>1?'s':''} off-track`);
    if(d.systems?.counts?.needsAttention) parts.push(`${d.systems.counts.needsAttention} system${d.systems.counts.needsAttention>1?'s':''} need attention`);
    if(flags.length) parts.push(`${flags.length} auto-flag${flags.length>1?'s':''}`);
    h += `<div class="statebanner"><span class="bigicon">🛠️</span><div class="txt"><h2 class="scotch">The machine needs work</h2><p>${esc(parts.join(' · ')||'Review the flags below')}. Fix the highest-leverage one first.</p></div></div>`;
  }

  // hero / next-move
  if(hero){
    if(hero.kind==='flag'){
      h += `<div class="hero"><div class="eyebrow">⚡ Highest-leverage fix</div><h1 class="scotch">${esc(hero.message)}</h1><p class="sub">Auto-flag · ${esc(hero.source)}</p></div>`;
    } else if(hero.kind==='rock'){
      h += `<div class="hero"><div class="eyebrow">⚡ Highest-leverage fix</div><h1 class="scotch">${esc(hero.name)}</h1><p class="sub">Rock · ${hero.pct}% complete · off track</p>${hero.nextAction?`<div class="next"><span class="lbl">Next action</span>${esc(hero.nextAction)}</div>`:''}${hero.notionUrl?`<div class="meta"><a class="btn btn-primary" href="${esc(hero.notionUrl)}" target="_blank">→ Open in Notion</a></div>`:''}</div>`;
    } else {
      const growth = hero.framing==='growth';
      h += `<div class="hero">
        <div class="eyebrow">${growth?'✦ Next growth move':'⚡ Highest-leverage fix'}</div>
        <h1 class="scotch">${esc(hero.name)}</h1>
        <p class="sub">${esc(hero.func||'Business system')} · ${esc(hero.health||'')}${hero.quickWin?' · quick win':''}</p>
        ${hero.whatsMissing?`<div class="why">${esc(hero.whatsMissing)}</div>`:''}
        ${hero.nextActions?`<div class="next"><span class="lbl">Next action</span>${esc(hero.nextActions)}</div>`:''}
        <div class="meta">
          ${sysPrioBadge(hero.priority)} ${healthBadge(hero.health)} ${hero.quickWin?'<span class="badge b-quickwin">Quick win</span>':''}
          <span class="ie">Impact <b>${hero.impact??'—'}/5</b></span><span class="ie">Effort <b>${hero.effort??'—'}/5</b></span>
          ${hero.url?`<a class="btn ${growth?'btn-green':'btn-primary'}" style="margin-left:auto" href="${esc(hero.url)}" target="_blank">→ Open in Notion</a>`:''}
        </div>
      </div>`;
    }
  }

  // A nudge toward the dedicated Issues tab (flags + IDS queue live there now).
  const flagN = flags.length, issN = issues.length;
  if(flagN || issN){
    const bits=[flagN?`${flagN} auto-flag${flagN>1?'s':''}`:null, `${issN} open issue${issN===1?'':'s'}`].filter(Boolean).join(' · ');
    h += `<button class="add-issue-btn" onclick="showTab('issues')">${esc(bits)} → Review on Issues tab</button>`;
  }
  document.getElementById('tab-pulse').innerHTML = h;
}

// ── ISSUES (auto-flags + IDS queue, moved off Pulse) ──
function renderIssues(d){
  const calm = d.state==='calm';
  const flags = d.pulse?.autoFlags||[];
  const issues = (d.pulse?.teamIssues||[]).filter(scaleMine);
  let h='';

  window._scFlags = flags;
  if(flags.length){
    const flagsBody = `<div class="issue-list">`+ flags.map((f,idx)=>`
      <div class="flag-card ${f.severity==='red'?'red':''}"><span class="fi">${f.severity==='red'?'🔴':'🟡'}</span><div class="fbody"><div class="ft">${esc(f.message)}</div><div class="fs">${esc(f.source)}</div></div><button class="flag-add" title="Add to Issues List" onclick="addFlagToIssues(${idx}, this)">+</button></div>`).join('') +`</div>`;
    h += scCard('⚑ Auto-flags', flagsBody, {count:flags.length, tone:'red', key:'scale-flags'});
  }

  // Working copy for the board: clone so optimistic drag/complete/priority edits
  // don't mutate DATA. Only the two open columns (Current/Agenda) live here.
  window._scIssues = issues.map(o => ({ ...o, status: o.status || 'Current' }));
  h += scCard('Issues List', `<div id="sc-issues-board">${scIssuesBoardHtml()}</div>`, {count:issues.length, tone:calm?'green':'zone', key:'scale-issues'});

  if(calm && !flags.length){
    h += `<div class="empty-state"><div class="ei">✓</div><div class="et">No auto-flags</div><div>Scorecard metrics are on track. No critical system gaps. Revenue pacing to goal.</div></div>`;
  }
  h += `<button class="add-issue-btn" onclick="toast('Add an issue in Notion → ISSUES [DB]')">+ Add issue in Notion</button>`;
  document.getElementById('tab-issues').innerHTML = h;
}

// notion:// deep link so "Open in Notion" hands off to the app (not the browser).
window.toNotionLink = function(url){
  if (!url) return url;
  const m = url.match(/([a-f0-9]{32})/i);
  if (m) return `notion://www.notion.so/${m[1]}`;
  if (url.startsWith('https://www.notion.so/')) return url.replace('https://', 'notion://');
  if (url.startsWith('https://app.notion.com/')) return url.replace('https://app.notion.com/', 'notion://www.notion.so/');
  return url;
};
window.openNotion = function(url){
  const link = window.toNotionLink(url);
  if (link && link.startsWith('notion://')) { window.location.href = link; return; }
  window.open(url, '_blank', 'noopener');
};

// Promote an auto-flag into the Issues List (creates a Notion issue), then refresh.
async function addFlagToIssues(idx, btn){
  const f = (window._scFlags||[])[idx];
  if(!f) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch('/api/scale/issue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:f.message, severity:f.severity, source:f.source }) });
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error||'failed');
    btn.textContent = '✓';
    toast('Added to Issues List');
    await load(true);
  } catch(e){
    btn.disabled = false; btn.textContent = '+';
    toast("Couldn't add: "+e.message);
  }
}

// ── Issues board (Current | Agenda) — drag to move, check to complete ──
const SC_PRIO_RANK = { URGENT:4, HIGH:3, NORMAL:2, none:1 };
let _scSortPri  = localStorage.getItem('sc-iss-sort')  === '1';
let _scGroupDate= localStorage.getItem('sc-iss-group') === '1';
function scPrioKey(p){ return (p||'none').toLowerCase(); }
function scAddedShort(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
// Relative-age buckets for "Group by date added" (newest rank first).
function scDateBucket(iso){
  if(!iso) return {rank:9, label:'No date'};
  const days = Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(days<=7)  return {rank:0, label:'This Week'};
  if(days<=14) return {rank:1, label:'Last Week'};
  if(days<=30) return {rank:2, label:'This Month'};
  if(days<=60) return {rank:3, label:'Last Month'};
  if(days<=90) return {rank:4, label:'Last 3 Months'};
  return {rank:5, label:'Over 90 Days Ago'};
}
function scOrderVal(i){ return i.order==null ? Infinity : i.order; }
function scIssueCard(i){
  const pr = i.priority || 'none';
  const date = scAddedShort(i.createdTime);
  const other = i.status==='Agenda' ? 'Current' : 'Agenda';
  const arrow = i.status==='Agenda' ? '←' : '→';
  return `<div class="sc-icard" draggable="true" data-id="${i.id}" ondragstart="scDragStart(event,'${i.id}')" ondragend="scDragEnd(event)">
    <button class="sc-check" title="Mark complete" onclick="scComplete(event,'${i.id}')"></button>
    <div class="sc-icard-main">
      <div class="sc-iname" onclick="scOpenIssueModal('${i.id}')" title="Edit issue">${esc(i.name)}</div>
      <div class="sc-imeta">
        <span class="sc-prio p-${scPrioKey(pr)}" onclick="scPriorityMenu(event,'${i.id}')" title="Change priority">${pr==='none'?'No priority':esc(pr)}</span>
        ${date?`<span class="sc-added">Added ${date}</span>`:''}
      </div>
    </div>
    <button class="sc-move" title="Move to ${other}" onclick="scMove('${i.id}','${other}')">${arrow}</button>
  </div>`;
}
function scColumn(key,label,dotCls){
  let list = (window._scIssues||[]).filter(i=>(i.status||'Current')===key).slice();
  // Default view follows the saved manual order; the toggle overrides with priority.
  list.sort(_scSortPri
    ? (a,b)=>(SC_PRIO_RANK[b.priority||'none']||0)-(SC_PRIO_RANK[a.priority||'none']||0)
    : (a,b)=>scOrderVal(a)-scOrderVal(b));
  let inner;
  if(!list.length){ inner = `<div class="sc-col-empty">Nothing here yet.</div>`; }
  else if(_scGroupDate){
    const buckets={}, labels={};
    list.forEach(i=>{ const b=scDateBucket(i.createdTime); (buckets[b.rank]=buckets[b.rank]||[]).push(i); labels[b.rank]=b.label; });
    inner = Object.keys(buckets).map(Number).sort((a,b)=>a-b).map(r=>
      `<div class="sc-daygrp"><div class="sc-dayhd">${labels[r]}</div>${buckets[r].map(scIssueCard).join('')}</div>`).join('');
  } else { inner = list.map(scIssueCard).join(''); }
  return `<div class="sc-col" data-status="${key}" ondragover="scDragOver(event)" ondragleave="scDragLeave(event)" ondrop="scDrop(event,'${key}')">
    <div class="sc-col-hd"><span class="sc-col-dot ${dotCls}"></span>${label}<span class="sc-col-n">${list.length}</span></div>
    <div class="sc-col-body">${inner}</div>
  </div>`;
}
function scIssuesBoardHtml(){
  const bar = `<div class="sc-issbar">
    <button class="sc-chip ${_scSortPri?'on':''}" onclick="scToggleSort()">⇅ Sort by priority</button>
    <button class="sc-chip ${_scGroupDate?'on':''}" onclick="scToggleGroup()">📅 Group by date added</button>
  </div>`;
  return bar + `<div class="sc-board">${scColumn('Current','Current','current')+scColumn('Agenda','Agenda','agenda')}</div>`;
}
function paintIssuesBoard(){ const el=document.getElementById('sc-issues-board'); if(el) el.innerHTML=scIssuesBoardHtml(); }
function scToggleSort(){ _scSortPri=!_scSortPri; localStorage.setItem('sc-iss-sort',_scSortPri?'1':'0'); paintIssuesBoard(); }
function scToggleGroup(){ _scGroupDate=!_scGroupDate; localStorage.setItem('sc-iss-group',_scGroupDate?'1':'0'); paintIssuesBoard(); }
function scUpdateIssueBadge(){
  const n=(window._scFlags||[]).length+(window._scIssues||[]).length;
  const el=document.getElementById('badge-issues'); if(el){ el.textContent=n; el.style.display=n?'':'none'; }
}
async function scPatchIssue(id, body){
  const r=await fetch('/api/scale/issue/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'failed'); return d;
}
let _scDragId=null;
function scDragStart(e,id){ _scDragId=id; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',id);}catch(_){} e.currentTarget.classList.add('dragging'); }
function scDragEnd(e){ e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.sc-col.over').forEach(c=>c.classList.remove('over')); }
function scDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('over'); }
function scDragLeave(e){ if(e.currentTarget.contains(e.relatedTarget)) return; e.currentTarget.classList.remove('over'); }
function scDropIndex(colBody, clientY){
  const cards=[...colBody.querySelectorAll('.sc-icard:not(.dragging)')];
  for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(clientY < r.top + r.height/2) return i; }
  return cards.length;
}
function scDrop(e,status){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const id=_scDragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain')); _scDragId=null;
  if(!id) return;
  // Positional reordering only makes sense in the flat default view; when sorted
  // by priority or grouped by date the auto-arrangement wins, so a drop just
  // moves the card between columns (status change).
  if(_scSortPri || _scGroupDate){ scMove(id,status); return; }
  const body=e.currentTarget.querySelector('.sc-col-body')||e.currentTarget;
  scReorderDrop(id, status, scDropIndex(body, e.clientY));
}
async function scMove(id,status){
  const it=(window._scIssues||[]).find(x=>x.id===id); if(!it||it.status===status) return;
  const prev=it.status; it.status=status; paintIssuesBoard();
  try{ await scPatchIssue(id,{status}); }
  catch(e){ it.status=prev; paintIssuesBoard(); toast("Couldn't move: "+e.message); }
}
// Drag within/into a column at a position → persist the new Board Order. Renumbers
// the target column 0..n and writes only the cards whose order actually changed.
async function scReorderDrop(id, status, dropIndex){
  const arr=window._scIssues||[]; const moved=arr.find(x=>x.id===id); if(!moved) return;
  const prevStatus=moved.status, prevOrder=moved.order;
  moved.status=status;
  const col=arr.filter(x=>x.status===status && x.id!==id).sort((a,b)=>scOrderVal(a)-scOrderVal(b));
  dropIndex=Math.max(0, Math.min(dropIndex, col.length));
  col.splice(dropIndex, 0, moved);
  const updates=[];
  col.forEach((it,idx)=>{ if(it.order!==idx){ it.order=idx; updates.push({id:it.id, order:idx}); } });
  paintIssuesBoard();
  try{
    if(prevStatus!==status) await scPatchIssue(id,{status});
    if(updates.length){
      const r=await fetch('/api/scale/issues/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({updates})});
      const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'failed');
    }
  }catch(e){ moved.status=prevStatus; moved.order=prevOrder; toast("Couldn't reorder: "+e.message); await load(true); }
}
async function scComplete(e,id){
  e.stopPropagation();
  const arr=window._scIssues||[]; const idx=arr.findIndex(x=>x.id===id); if(idx<0) return; const it=arr[idx];
  arr.splice(idx,1); paintIssuesBoard(); scUpdateIssueBadge();
  try{ await scPatchIssue(id,{status:'Done'}); toast('Marked complete'); }
  catch(err){ arr.splice(idx,0,it); paintIssuesBoard(); scUpdateIssueBadge(); toast("Couldn't complete: "+err.message); }
}
function scClosePrioMenu(){ const m=document.getElementById('sc-prio-menu'); if(m) m.remove(); }
function scPriorityMenu(e,id){
  e.stopPropagation(); scClosePrioMenu();
  const m=document.createElement('div'); m.className='sc-menu'; m.id='sc-prio-menu';
  m.innerHTML=[['URGENT','URGENT'],['HIGH','HIGH'],['NORMAL','NORMAL'],['none','No priority']]
    .map(([v,lbl])=>`<button class="sc-menu-it p-${v.toLowerCase()}" onclick="scSetPriority(event,'${id}','${v}')">${lbl}</button>`).join('');
  document.body.appendChild(m);
  const r=e.currentTarget.getBoundingClientRect();
  m.style.left=Math.round(window.scrollX+r.left)+'px';
  m.style.top=Math.round(window.scrollY+r.bottom+5)+'px';
  setTimeout(()=>document.addEventListener('click',scClosePrioMenu,{once:true}),0);
}
async function scSetPriority(e,id,val){
  e.stopPropagation(); scClosePrioMenu();
  const it=(window._scIssues||[]).find(x=>x.id===id); if(!it) return;
  const prev=it.priority; it.priority=val; paintIssuesBoard();
  try{ await scPatchIssue(id,{priority:val}); }
  catch(err){ it.priority=prev; paintIssuesBoard(); toast("Couldn't update priority: "+err.message); }
}

// ── Issue edit modal (title · priority · status) ──
let _scEditId=null, _scEditPrio='none', _scEditStatus='Current';
function scOpenIssueModal(id){
  const it=(window._scIssues||[]).find(x=>x.id===id); if(!it) return;
  _scEditId=id; _scEditPrio=it.priority||'none'; _scEditStatus=it.status||'Current';
  let bg=document.getElementById('sc-issue-modal');
  if(!bg){ bg=document.createElement('div'); bg.id='sc-issue-modal'; bg.className='sc-modal-bg'; bg.onclick=(e)=>{ if(e.target===bg) scCloseIssueModal(); }; document.body.appendChild(bg); }
  const prios=[['URGENT','p-urgent'],['HIGH','p-high'],['NORMAL','p-normal'],['none','p-none']];
  const stats=['Current','Agenda','Done'];
  bg.innerHTML=`<div class="sc-modal" onclick="event.stopPropagation()">
    <div class="sc-modal-hd"><h3>Edit issue</h3><button class="sc-modal-x" onclick="scCloseIssueModal()">×</button></div>
    <div class="sc-field"><label>Title</label><textarea id="sc-edit-title" class="sc-input" rows="2">${esc(it.name)}</textarea></div>
    <div class="sc-field"><label>Priority</label><div class="sc-seg" id="sc-edit-prio">${prios.map(([v,c])=>`<button class="${c} ${(_scEditPrio===v)?'sel':''}" onclick="scModalPick('prio','${v}')">${v==='none'?'None':v}</button>`).join('')}</div></div>
    <div class="sc-field"><label>Status</label><div class="sc-seg" id="sc-edit-status">${stats.map(v=>`<button class="${(_scEditStatus===v)?'sel':''}" onclick="scModalPick('status','${v}')">${v}</button>`).join('')}</div></div>
    <div class="sc-modal-ft">
      ${it.notionUrl?`<span class="sc-notion" onclick="openNotion('${esc(it.notionUrl)}')">↗ Open in Notion</span>`:''}
      <button class="sc-btn" onclick="scCloseIssueModal()">Cancel</button>
      <button class="sc-btn primary" id="sc-edit-save" onclick="scSaveIssue()">Save</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>bg.classList.add('show'));
  setTimeout(()=>{ const t=document.getElementById('sc-edit-title'); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } },60);
}
function scCloseIssueModal(){ const bg=document.getElementById('sc-issue-modal'); if(bg){ bg.classList.remove('show'); setTimeout(()=>bg.remove(),200);} _scEditId=null; }
function scModalPick(kind,val){
  if(kind==='prio'){ _scEditPrio=val; document.querySelectorAll('#sc-edit-prio button').forEach(b=>b.classList.toggle('sel', b.textContent===(val==='none'?'None':val))); }
  else { _scEditStatus=val; document.querySelectorAll('#sc-edit-status button').forEach(b=>b.classList.toggle('sel', b.textContent===val)); }
}
async function scSaveIssue(){
  const id=_scEditId; const it=(window._scIssues||[]).find(x=>x.id===id); if(!it) return;
  const title=(document.getElementById('sc-edit-title').value||'').trim();
  if(!title){ toast('Title required'); return; }
  const btn=document.getElementById('sc-edit-save'); btn.disabled=true; btn.textContent='Saving…';
  const prev={name:it.name,priority:it.priority,status:it.status};
  const newStatus=_scEditStatus, newPrio=_scEditPrio;
  // optimistic local update
  it.name=title; it.priority=newPrio; it.status=newStatus;
  const arr=window._scIssues||[]; let removed=false;
  if(newStatus==='Done'){ const idx=arr.findIndex(x=>x.id===id); if(idx>=0){ arr.splice(idx,1); removed=true; } }
  paintIssuesBoard(); scUpdateIssueBadge(); scCloseIssueModal();
  try{
    await scPatchIssue(id,{ title, priority:newPrio, status:newStatus });
    toast(newStatus==='Done'?'Marked complete':'Issue updated');
  }catch(err){
    // rollback
    it.name=prev.name; it.priority=prev.priority; it.status=prev.status;
    if(removed) arr.push(it);
    paintIssuesBoard(); scUpdateIssueBadge();
    toast("Couldn't save: "+err.message);
  }
}

// ── SCORECARD ──
// Per-quarter scorecard with a quarter selector + leading→lagging pairs.
let _scSelQ = null, _scCache = {};
function scQLabel(d, n) { return `${d.vtoQuarters?.year || new Date().getFullYear()} Q${n}`; }
async function scSelectQuarter(d, n) {
  _scSelQ = n;
  const label = scQLabel(d, n);
  if (!_scCache[label]) {
    renderScorecard(d);  // paints a "Loading…" state for the selected quarter
    try { _scCache[label] = await (await fetch('/api/scale/scorecard?quarter=' + encodeURIComponent(label))).json(); }
    catch (e) { _scCache[label] = { error: true }; }
  }
  renderScorecard(d);
}
function scMetricCard(m, sideLabel) {
  if (!m) return `<div class="sc-metric empty"><div class="sc-metric-top"><span class="sc-metric-name">${sideLabel}</span></div><div class="sc-metric-empty-note">not tracked yet</div></div>`;
  const w = m.pct == null ? 0 : Math.max(2, Math.min(100, m.pct));
  return `<div class="sc-metric l-${m.status || 'unknown'}">
    <div class="sc-metric-top"><span class="sc-metric-name">${esc(m.metric)}</span><span class="sc-metric-val ${valClass(m.status)}">${fmtMetricVal(m)}</span></div>
    <div class="sc-metric-foot"><div class="sc-bar"><i style="width:${w}%;background:${barColor(m.status)}"></i></div><span class="sc-metric-pct" style="color:${barColor(m.status)}">${m.pct == null ? '—' : m.pct + '%'}</span></div>
  </div>`;
}
function renderScorecard(d){
  const el = document.getElementById('tab-scorecard');
  if(!d.scorecard){ el.innerHTML = unavail('Scorecard unavailable','Could not load the VTO scorecard metrics.'); return; }
  const currentQ = d.vtoQuarters?.currentQ || 2;
  if(_scSelQ == null) _scSelQ = currentQ;
  const curLabel = scQLabel(d, currentQ);
  if(!_scCache[curLabel]) _scCache[curLabel] = d.scorecard;   // seed current quarter from initial payload
  const selLabel = scQLabel(d, _scSelQ);
  const sc = _scCache[selLabel];

  const qtabs = [1,2,3,4].map(n => `<button class="sc-qtab${n===_scSelQ?' sel':''}${n>currentQ?' future':''}" onclick="scSelectQuarter(DATA,${n})">Q${n}</button>`).join('');
  let h = `<div class="sc-qbar">${qtabs}</div>`;

  if(!sc){ el.innerHTML = h + `<div class="empty-line">Loading ${esc(selLabel)}…</div>`; return; }
  if(sc.error){ el.innerHTML = h + unavail('Unavailable','Could not load '+esc(selLabel)+'.'); return; }

  const metrics = sc.metrics || [];
  const off = (sc.offTrack ? sc.offTrack.length : sc.offTrackCount) || 0;
  const byName = {}; metrics.forEach(m => byName[(m.metric||'').toLowerCase()] = m);
  const pairs = sc.pairs || d.scorecard.pairs || [];
  const used = new Set();

  h += `<div class="eyebrow-row"><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:13px;font-weight:700;color:var(--text-2)">${esc(selLabel)} Scorecard</span><span class="badge ${off?'b-amber':'b-on-track'}">${off?off+' off-track':(sc.state==='future'?'upcoming':'on track')}</span></div></div>`;

  if(!metrics.length){ el.innerHTML = h + `<div class="empty-line">No wired scorecard metrics for ${esc(selLabel)}.</div>`; return; }

  // Leading → lagging pairs
  h += `<div class="sc-pairhead"><span>Leading (input)</span><span></span><span class="lag">Lagging (outcome)</span></div>`;
  h += pairs.map(([lead, lag]) => {
    const lm = byName[lead.toLowerCase()], gm = byName[lag.toLowerCase()];
    if(lm) used.add(lead.toLowerCase()); if(gm) used.add(lag.toLowerCase());
    return `<div class="sc-pair">${scMetricCard(lm, esc(lead))}<div class="sc-pair-arrow">→</div>${scMetricCard(gm, esc(lag))}</div>`;
  }).join('');

  // Everything not in a pair (financials, etc.)
  const others = metrics.filter(m => !used.has((m.metric||'').toLowerCase()));
  if(others.length){
    h += `<div class="sc-other-head">Other metrics</div>`;
    h += others.map(m => {
      const w = m.pct==null?0:Math.max(2,Math.min(100,m.pct));
      return `<div class="sc-metric l-${m.status||'unknown'}" style="margin-bottom:8px">
        <div class="sc-metric-top"><span class="sc-metric-name">${esc(m.metric)} <span style="font-size:10px;color:var(--text-4);font-weight:500">${esc(m.category||'')}</span></span><span class="sc-metric-val ${valClass(m.status)}">${fmtMetricVal(m)}</span></div>
        <div class="sc-metric-foot"><div class="sc-bar"><i style="width:${w}%;background:${barColor(m.status)}"></i></div><span class="sc-metric-pct" style="color:${barColor(m.status)}">${m.pct==null?'—':m.pct+'%'}</span></div>
      </div>`;
    }).join('');
  }
  h += `<div style="font-size:11px;color:var(--text-3);text-align:center;margin-top:10px;">Actuals computed live from Xero + Convert/Speaking for ${esc(selLabel)}.</div>`;
  el.innerHTML = h;
}

// ── FINANCE ──
// Reads the SAME source as the /index finance board (/api/finance/xero, the raw
// computeXeroFinance), so the numbers match exactly — incl. Cash on Hand from the
// sum of bank accounts (bankTotal), not Xero's netted "Total" row.
let _finRaw = null, _finLoading = false;
function renderFinance(){
  const el = document.getElementById('tab-finance');
  if (_finRaw) { finBoard(el, _finRaw); return; }
  if (_finLoading) return;
  _finLoading = true;
  el.innerHTML = `<div style="padding:22px 4px;color:var(--text-3);font-size:13px;text-align:center;">Loading finance…</div>`;
  fetch('/api/finance/xero').then(r => r.json()).then(d => {
    _finLoading = false;
    if (!d || d.error) { el.innerHTML = unavail('Finance unavailable', d && d.needsAuth ? 'Connect Xero at /auth/xero to populate cash, runway, and revenue.' : 'Could not load Xero data.'); return; }
    _finRaw = d; finBoard(el, d);
  }).catch(() => { _finLoading = false; el.innerHTML = unavail('Finance unavailable', 'Could not load Xero data.'); });
}

function finBoard(el, d){
  const pctClass = (p) => p >= 90 ? 'c-green' : p >= 65 ? 'c-amber' : 'c-red';
  const card = (label, val, sub, cls) => `<div class="fin-card"><div class="fin-label">${label}</div><div class="fin-value ${cls||''}">${val}</div><div class="fin-sub">${sub||''}</div></div>`;
  const revCard = (label, actual, goalObj, note) => {
    const goal = goalObj && goalObj.goal || 0;
    const p = goal ? Math.round((actual / goal) * 100) : null;
    const w = p == null ? 0 : Math.max(2, Math.min(100, p));
    const c = p == null ? '' : (p >= 90 ? 'pos' : p >= 65 ? 'warn' : 'neg');
    return `<div class="fin-card"><div class="fin-label">${label}</div><div class="fin-value ${c}">${moneyK(actual)}</div><div class="fin-sub">vs ${moneyK(goal)} goal</div><div class="fin-bar"><i style="width:${w}%;background:${p==null?'var(--text-4)':(p>=90?'var(--green)':p>=65?'var(--amber)':'var(--red)')}"></i></div><div class="fin-pct ${p==null?'':pctClass(p)}">${p==null?'—':p+'%'}</div>${note||''}</div>`;
  };
  const nBank = (d.bankAccounts || []).length, nCard = (d.creditCards || []).length;

  // Cash Capacity as a regular fin-card
  const cc = d.cashCapacity || {}; const ccM = cc.months ?? 0;
  const capCls = ccM >= 3 ? 'pos' : ccM >= 1 ? 'warn' : 'neg';
  const capBg = ccM >= 3 ? 'var(--green)' : ccM >= 1 ? 'var(--amber)' : 'var(--red)';
  const capCard = `<div class="fin-card">
    <div class="fin-label">Cash Capacity</div>
    <div class="fin-value ${capCls}">${ccM}<span style="font-size:12px;font-weight:600;margin-left:2px;color:var(--text-3)">mo</span></div>
    <div class="fin-sub">${money(cc.amount)} / ${money(cc.goalAmount||90000)} goal</div>
    <div class="fin-bar"><i style="width:${Math.min(100,cc.pctToGoal||0)}%;background:${capBg}"></i></div>
    ${cc.accountsFound === false ? `<div style="font-size:10px;color:var(--amber);margin-top:4px">⚠ Check Xero account names</div>` : ''}
  </div>`;

  // Three revenue projection bars (same look as the Sales pulse) — Year → Quarter
  // → Month. Each period scopes collected / approved quotes / recurring to its own
  // timeframe (from DATA.vtoQuarters.periods) so the numbers differ per period.
  const A = (typeof DATA !== 'undefined' && DATA && DATA.vtoQuarters) ? DATA.vtoQuarters : null;
  const periodBar = (title, p, note) => {
    if (!p || !(p.goal || p.projected != null)) return '';
    const goal = p.goal, proj = p.projected;
    const collected = p.actual || 0, invoiced = p.ar || 0, quotes = p.acceptedQuotes, recur = p.recurringRest || 0;
    const booked = collected + invoiced;
    const segs = [
      ['Collected', collected, 'collected'],
      ['Invoiced', invoiced, 'invoiced'],
      ...(quotes != null ? [['Approved quotes', quotes, 'quotes']] : []),
      [`Recurring (${p.remainingMonths != null ? p.remainingMonths + ' mo' : 'proj'})`, recur, 'recur'],
    ];
    const pctOf = (v) => goal ? Math.max(0, Math.min(100, (v / goal) * 100)) : 0;
    const gap = (goal != null && proj != null) ? goal - proj : null;
    const bar = segs.map(([, v, cls]) => v > 0 ? `<div class="vqa-seg ${cls}" style="width:${pctOf(v)}%"></div>` : '').join('');
    const legend = segs.map(([label, v, cls]) => `<span class="vqa-leg"><span class="vqa-sw ${cls}"></span>${label} <b>${money(v || 0)}</b></span>`).join('');
    const key = 'fin-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    return `<div class="t-card" data-persist-key="${key}"><div class="sec-head"><div class="card-toggle" onclick="toggleCard(this)"><span class="chev">▾</span><div class="sec-title">${title}</div></div></div>
      <div class="t-body"><div class="vqa">
        <div class="vqa-bar">${bar}</div>
        <div class="vqa-top">
          <div class="vqa-amt">${money(booked)} <span class="vqa-amt-sub">booked</span></div>
          <div class="vqa-gap ${gap != null && gap <= 0 ? 'good' : ''}">${gap == null ? '' : (gap <= 0 ? 'beats goal by ' + moneyK(-gap) : moneyK(gap) + ' to go')} · goal ${goal ? moneyK(goal) : '—'}</div>
        </div>
        <div class="vqa-legend">${legend}</div>
        ${note || ''}
      </div></div></div>`;
  };
  const P = (A && A.periods) || {};
  const netCls = (d.mtdNet||0)>=0 ? 'var(--green)' : 'var(--red)';
  const monthNote = `<div class="fin-sub" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft,var(--border));">Net-to-date <b style="color:${netCls}">${moneyK(d.mtdNet)}</b> · ${(d.mtdNet||0)>=0?'in the black':'in the red'}</div>`;
  // Year / Quarter / Month projections, then current cash position. YTD revenue and
  // A/R aren't separate cards — they're the Collected + Invoiced segments here.
  let h = periodBar(`Revenue · ${A ? A.year : ''}`, P.year)
    + periodBar(`This Quarter${A && A.currentQ ? ' · Q' + A.currentQ : ''}`, P.quarter)
    + periodBar('This Month', P.month, monthNote)
    + `<div class="eyebrow-row"><span class="eyebrow">Cash position</span></div>`
    + `<div class="fin-grid-3">`
      + card('Cash on Hand', moneyK(d.bankTotal), `${nBank} account${nBank===1?'':'s'}`, (d.bankTotal||0)<0?'neg':'')
      + capCard
      + card('Avg Recurring Rev', d.recurringRevenueAvg!=null?moneyK(d.recurringRevenueAvg)+'<span style="font-size:12px;font-weight:600;color:var(--text-3)">/mo</span>':'—', 'rolling 12 mo ÷ 12')
    + `</div>`;

  // Bank + credit-card accounts
  let bankBody = '';
  if (nBank) {
    bankBody += `<div class="accounts"><div class="acc-head"><span>Account</span><span>Balance</span></div>`
      + d.bankAccounts.map(a => `<div class="acc-row"><span class="acc-name">${esc(a.name)}</span><span class="acc-val">${money(a.balance)}</span></div>`).join('')
      + `<div class="acc-row total"><span class="acc-name bold">Total</span><span class="acc-val pos">${money(d.bankTotal)}</span></div></div>`;
  }
  if (nCard) {
    bankBody += `<div class="accounts"><div class="acc-head"><span>Credit Card</span><span>Balance</span></div>`
      + d.creditCards.map(a => `<div class="acc-row"><span class="acc-name">${esc(a.name)}</span><span class="acc-val neg">${money(a.balance)}</span></div>`).join('')
      + `<div class="acc-row total"><span class="acc-name bold">Total</span><span class="acc-val neg">${money(d.creditTotal)}</span></div></div>`;
  }
  if (bankBody) h += scCard('Bank accounts', bankBody, { key: 'scale-bank' });

  if (d.asOf) h += `<div style="font-size:11px;color:var(--text-4);text-align:center;margin-top:4px;">As of ${new Date(d.asOf).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>`;
  el.innerHTML = h;
  if (window.restoreCards) restoreCards();
}

// ── SYSTEMS ──
function renderSystems(d){
  const el = document.getElementById('tab-systems');
  if(!d.systems){ el.innerHTML = unavail('Systems unavailable','Could not load the business functions board.'); return; }
  const c = d.systems.counts||{};
  const calm = d.state==='calm';
  let h = `<div class="sys-summary">
    <div class="sys-stat"><div class="n" style="color:${c.critical?'var(--red)':'var(--text-3)'}">${c.critical||0}</div><div class="l">Critical</div></div>
    <div class="sys-stat"><div class="n" style="color:${c.brokenMissing?'var(--red)':'var(--text-3)'}">${c.brokenMissing||0}</div><div class="l">Broken / Missing</div></div>
    <div class="sys-stat"><div class="n c-amber">${c.needsAttention||0}</div><div class="l">Needs Attention</div></div>
    <div class="sys-stat"><div class="n c-green">${c.healthy||0}</div><div class="l">Healthy</div></div>
  </div>`;

  const sysCard=(s)=>`<div class="sys-card ${s.health==='Broken'||s.health==='Missing'?'l-red':'l-amber'}">
    <div class="sys-body"><div class="sys-name-row"><span class="sys-name">${esc(s.name)}</span>${healthBadge(s.health)}${sysPrioBadge(s.priority)}${s.quickWin?'<span class="badge b-quickwin">Quick win</span>':''}</div>
    <div class="sys-meta">${esc(s.func||'')}<span class="ie">Impact <b>${s.impact??'—'}</b></span><span class="ie">Effort <b>${s.effort??'—'}</b></span></div>
    ${s.nextActions?`<div class="sys-next"><b style="color:var(--text-2)">Next:</b> ${esc(s.nextActions)}</div>`:''}</div>
    <div class="maturity">${maturityDots(s.maturity)}<div class="md-lbl">${s.maturity??'—'} / 5</div></div></div>`;
  const healthyCard=(s)=>`<div class="sys-card"><div class="sys-body"><div class="sys-name-row"><span class="sys-name">${esc(s.name)}</span>${healthBadge(s.health)}</div><div class="sys-meta">${esc(s.func||'')}</div></div><div class="maturity">${maturityDots(s.maturity)}<div class="md-lbl">${s.maturity??'—'} / 5</div></div></div>`;

  const fixFirst = d.systems.fixFirst||[];
  const quickWins = d.systems.quickWins||[];
  const needsReview = d.systems.needsReview||[];
  const healthy = d.systems.healthy||[];

  // Calm leads with healthy; stressed leads with fix-first.
  const fixSection = () => {
    let s='';
    if(fixFirst.length){ s+=scCard('Fix first — critical', `<div class="sys-list">${fixFirst.map(sysCard).join('')}</div>`, {count:fixFirst.length, tone:'red', key:'scale-fixfirst'}); }
    if(quickWins.length){ s+=scCard('Quick wins — high impact, low effort', `<div class="sys-list">${quickWins.map(sysCard).join('')}</div>`, {count:quickWins.length, tone:'zone', key:'scale-quickwins'}); }
    if(needsReview.length){ s+=scCard('Needs review', `<div class="sys-list">${needsReview.map(sysCard).join('')}</div>`, {count:needsReview.length, tone:'amber', key:'scale-needsreview'}); }
    if(!fixFirst.length && !quickWins.length && !needsReview.length){ s+=`<div class="empty-line">Every business system is healthy. ✓</div>`; }
    return s;
  };
  const healthySection = () => {
    if(!healthy.length) return '';
    const shown = healthy.slice(0,5);
    let body=`<div class="sys-list">${shown.map(healthyCard).join('')}</div>`;
    if(healthy.length>5) body+=`<button class="view-all-btn" onclick="toast('Open BUSINESS FUNCTIONS [DB] in Notion')">+ ${healthy.length-5} more healthy systems</button>`;
    return scCard('Healthy systems', body, {count:healthy.length, tone:'green', key:'scale-healthy'});
  };

  h += calm ? (healthySection()+fixSection()) : (fixSection()+healthySection());
  el.innerHTML = h;
}

// ── VTO Vision side (EOS top half): Core Values, Core Focus, 10-Year Target,
// 3-Year Picture, Marketing Strategy. All read from the VTO [DB]. ──
const VE_GROUPS = {
  vision:    { sections:['Core Value','Core Focus','10-Year Target'], title:'Vision & Core Focus' },
  three:     { sections:['3-Year Picture'], title:'3-Year Picture' },
  marketing: { sections:['Marketing Strategy'], title:'Marketing Strategy' },
  goals:     { sections:['1-Year Goal'], title:'1-Year Goals' },
};
const vesPencil = (key) => `<button class="sc-edit-btn" title="Edit" onclick="event.stopPropagation();scEditVision('${key}')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`;
function scVisionHtml(v){
  let h='';
  const cv=(v.coreValues||[]).map(x=>`<span class="vis-chip">${esc(x.item)}</span>`).join('');
  const focus=v.coreFocus||[];
  const purpose=focus.find(f=>f.field==='Purpose'), tag=focus.find(f=>f.field==='Tagline'), niche=focus.find(f=>f.field==='Niche');
  const ten=v.tenYear;
  let vb='<div class="vis">';
  if(cv) vb+=`<div class="vis-row"><div class="vis-label">Core Values</div><div class="vis-vals">${cv}</div></div>`;
  if(purpose||tag||niche){
    vb+=`<div class="vis-row"><div class="vis-label">Core Focus</div><div>`;
    if(purpose) vb+=`<div class="vis-purpose">${esc(purpose.detail||purpose.label)}</div>`;
    if(tag) vb+=`<div class="vis-tag">${esc(tag.label)}${tag.detail?` — ${esc(tag.detail)}`:''}</div>`;
    if(niche) vb+=`<div class="vis-niche"><b>Niche:</b> ${esc(niche.label)}</div>`;
    vb+=`</div></div>`;
  }
  if(ten) vb+=`<div class="vis-bhag"><div class="vis-label">10-Year Target (BHAG)</div><div class="vis-bhag-val">${esc(ten.label)}</div>${ten.detail?`<div class="vis-bhag-sub">${esc(ten.detail)}</div>`:''}</div>`;
  vb+='</div>';
  h += scCard('Vision & Core Focus', vb, {key:'scale-vis', action:vesPencil('vision')});

  const ty=v.threeYear||{};
  if((ty.looksLike&&ty.looksLike.length)||ty.summary){
    let b='<div class="v3">';
    if(ty.summary) b+=`<div class="v3-sum"><b>${esc(ty.summary.label)}</b>${ty.summary.detail?` — ${esc(ty.summary.detail)}`:''}</div>`;
    if(ty.looksLike&&ty.looksLike.length) b+=`<div class="v3-grid">${ty.looksLike.map(x=>`<div class="v3-item">${esc(x.item)}</div>`).join('')}</div>`;
    b+='</div>';
    h += scCard('3-Year Picture', b, {key:'scale-3yr', action:vesPencil('three')});
  }

  const mk=v.marketing||[];
  if(mk.length){
    const body=`<div class="vmk">${mk.map(m=>`<div class="vmk-row"><div class="vmk-lbl">${esc(m.label||'')}</div><div class="vmk-txt">${esc(m.detail||'')}</div></div>`).join('')}</div>`;
    h += scCard('Marketing Strategy', body, {key:'scale-mktg', action:vesPencil('marketing')});
  }
  return h;
}
function vgBarColor(pct){ return pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)'; }
function vgGoal(g){
  const money=['Recurring Revenue','Revenue','Profit','Debt Paydown'];
  const fmt=(val)=> (g.metric&&money.includes(g.metric))?moneyK(val):String(val);
  if(g.metric && g.current!=null && g.target!=null){
    const neg=g.current<0; const pct=Math.max(0,Math.min(100,Math.round((g.current/g.target)*100)));
    return `<div class="vg-goal"><div class="vg-top"><span class="vg-name">${esc(g.text)}</span><span class="vg-val ${neg?'neg':''}">${fmt(g.current)} <span class="vg-of">/ ${fmt(g.target)}</span></span></div><div class="vg-bar"><i style="width:${neg?2:Math.max(2,pct)}%;background:${neg?'var(--red)':vgBarColor(pct)}"></i></div></div>`;
  }
  if(g.metric && g.target!=null){
    return `<div class="vg-goal"><div class="vg-top"><span class="vg-name">${esc(g.text)}</span><span class="vg-val muted">target ${fmt(g.target)}</span></div></div>`;
  }
  return `<div class="vg-goal manual"><span class="vg-check ${g.done?'done':''}">${g.done?'✓':''}</span><span class="vg-name">${esc(g.text)}</span></div>`;
}
function scYearGoalsHtml(v){
  const goals=v.yearGoals||[]; if(!goals.length) return '';
  const live=goals.filter(g=>g.metric&&g.current!=null);
  const onTrack=live.filter(g=>g.current/g.target>=0.7).length;
  const count=live.length?`${onTrack}/${live.length} on pace`:`${goals.length} goals`;
  return scCard('1-Year Goals', `<div class="vg">${goals.map(vgGoal).join('')}</div>`, {count, tone:'zone', key:'scale-ygoals', action:vesPencil('goals')});
}

// ── Vision in-app editor (writes to VTO [DB]) ──
const VE_SEC_LABEL={'Core Value':'Core Values','Core Focus':'Core Focus','10-Year Target':'10-Year Target','3-Year Picture':'3-Year Picture','Marketing Strategy':'Marketing Strategy','1-Year Goal':'1-Year Goals'};
let _veRows=[], _veSections=[], _veTitle='';
function scEditVision(key){
  const g=VE_GROUPS[key]; if(!g) return;
  _veSections=g.sections; _veTitle=g.title;
  const all=(window.DATA?.vision?.rows)||[];
  _veRows = all.filter(r=>_veSections.includes(r.section)).map(r=>({
    id:r.id, section:r.section, field:r.field||null, item:r.item||'', detail:r.detail||'',
    metric:r.metric||null, target:(r.target!=null?r.target:''), done:!!r.done, sort:r.sort||0,
    _orig:JSON.stringify({item:r.item||'',detail:r.detail||'',metric:r.metric||null,target:(r.target!=null?r.target:''),done:!!r.done,field:r.field||null})
  }));
  scPaintVision();
}
function scVeRow(r, idx){
  const sec=r.section;
  let inner;
  if(sec==='1-Year Goal'){
    const metricOpts=['','Recurring Revenue','Revenue','Profit','Speaking Stages','Debt Paydown'];
    inner=`<input class="sc-input" value="${esc(r.item)}" placeholder="Goal" oninput="scVeSet(${idx},'item',this.value)">
      <div class="ve-srow">
        <select class="sc-input" onchange="scVeSet(${idx},'metric',this.value||null)">${metricOpts.map(m=>`<option value="${esc(m)}" ${(r.metric||'')===m?'selected':''}>${m?esc(m):'No live metric'}</option>`).join('')}</select>
        <input class="sc-input" type="number" style="max-width:110px" value="${esc(r.target)}" placeholder="Target" oninput="scVeSet(${idx},'target',this.value)">
        <label class="ve-check"><input type="checkbox" ${r.done?'checked':''} onchange="scVeSet(${idx},'done',this.checked)"> Done</label>
      </div>`;
  } else if(sec==='Core Value' || (sec==='3-Year Picture' && r.field!=='Summary')){
    inner=`<input class="sc-input" value="${esc(r.item)}" placeholder="${sec==='Core Value'?'Core value':'What it looks like…'}" oninput="scVeSet(${idx},'item',this.value)">`;
  } else {
    inner=`${r.field?`<div class="ve-ftag">${esc(r.field)}</div>`:''}<input class="sc-input" value="${esc(r.item)}" placeholder="Heading" oninput="scVeSet(${idx},'item',this.value)"><textarea class="sc-input" rows="2" placeholder="Detail" oninput="scVeSet(${idx},'detail',this.value)">${esc(r.detail)}</textarea>`;
  }
  return `<div class="ve-row"><div class="ve-fields">${inner}</div><button class="ve-del" title="Remove" onclick="scVeDelete(${idx})">×</button></div>`;
}
function scPaintVision(){
  let bg=document.getElementById('sc-vision-modal');
  if(!bg){ bg=document.createElement('div'); bg.id='sc-vision-modal'; bg.className='sc-modal-bg'; bg.onclick=e=>{ if(e.target===bg) scCloseVision(); }; document.body.appendChild(bg); }
  let groups='';
  _veSections.forEach(sec=>{
    const rows=_veRows.map((r,idx)=>({r,idx})).filter(x=>x.r.section===sec && !x.r._deleted);
    const rowsHtml=rows.length?rows.map(x=>scVeRow(x.r,x.idx)).join(''):'<div class="empty-line">None yet.</div>';
    const noun=(VE_SEC_LABEL[sec]||sec).replace(/s$/,'');
    groups+=`<div class="ve-group"><div class="vis-label" style="margin-bottom:8px">${esc(VE_SEC_LABEL[sec]||sec)}</div><div class="ve-list">${rowsHtml}</div><button class="ve-add" onclick="scVeAdd('${sec}')">+ Add ${esc(noun)}</button></div>`;
  });
  bg.innerHTML=`<div class="sc-modal" onclick="event.stopPropagation()" style="max-width:560px">
    <div class="sc-modal-hd"><h3>Edit ${esc(_veTitle)}</h3><button class="sc-modal-x" onclick="scCloseVision()">×</button></div>
    ${groups}
    <div class="sc-modal-ft"><button class="sc-btn" onclick="scCloseVision()">Cancel</button><button class="sc-btn primary" id="sc-vis-save" onclick="scSaveVision()">Save</button></div>
  </div>`;
  requestAnimationFrame(()=>bg.classList.add('show'));
}
function scVeSet(idx,key,val){ if(_veRows[idx]) _veRows[idx][key]=val; }
function scVeDelete(idx){ const r=_veRows[idx]; if(!r) return; if(!r.id){ _veRows.splice(idx,1); } else { r._deleted=true; } scPaintVision(); }
function scVeAdd(sec){
  const field = sec==='3-Year Picture' ? 'Looks Like' : (sec==='Core Focus' ? 'Purpose' : null);
  const maxSort=_veRows.filter(r=>r.section===sec).reduce((m,r)=>Math.max(m,r.sort||0),0);
  _veRows.push({ id:null, section:sec, field, item:'', detail:'', metric:null, target:'', done:false, sort:maxSort+1, _new:true });
  scPaintVision();
}
function scCloseVision(){ const bg=document.getElementById('sc-vision-modal'); if(bg){ bg.classList.remove('show'); setTimeout(()=>bg.remove(),200); } }
async function scSaveVision(){
  const btn=document.getElementById('sc-vis-save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const H={'Content-Type':'application/json'};
  const ops=[];
  _veRows.forEach(r=>{
    if(r._deleted && r.id){ ops.push(fetch('/api/scale/vision/'+r.id,{method:'DELETE'})); return; }
    if(r._deleted) return;
    const payload={ section:r.section, field:r.field, item:r.item, detail:r.detail, metric:r.metric, target:r.target, done:r.done, sort:r.sort };
    if(!r.id){ if(!(r.item||'').trim()) return; ops.push(fetch('/api/scale/vision',{method:'POST',headers:H,body:JSON.stringify(payload)})); return; }
    const cur=JSON.stringify({item:r.item||'',detail:r.detail||'',metric:r.metric||null,target:(r.target!=null?r.target:''),done:!!r.done,field:r.field||null});
    if(cur!==r._orig){ ops.push(fetch('/api/scale/vision/'+r.id,{method:'PATCH',headers:H,body:JSON.stringify({item:r.item,detail:r.detail,metric:r.metric,target:r.target,done:r.done,field:r.field})})); }
  });
  if(!ops.length){ scCloseVision(); return; }
  try{
    const res=await Promise.all(ops);
    for(const x of res){ if(!x.ok){ const d=await x.json().catch(()=>({})); throw new Error(d.error||'save failed'); } }
    toast('Vision updated'); scCloseVision(); await load(true);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Save'; } toast("Couldn't save: "+e.message); }
}

function renderVto(d){
  const el = document.getElementById('tab-vto');
  const vq = d.vtoQuarters;
  if(!vq){ el.innerHTML = unavail('VTO unavailable','Could not load quarterly data.'); return; }
  if(_vtoSelQ == null) _vtoSelQ = vq.currentQ || 1;
  const vision = d.vision;

  // 1. Annual revenue — projected to year end as a stacked, multi-color bar
  // (collected + A/R + all future quotes + recurring×remaining-months) vs goal.
  const a = vq.annual || {};
  const ag = a.goal, proj = a.projected;
  const segs = [
    ['Collected', a.actual || 0, 'collected'],
    ['Invoiced (A/R)', a.ar || 0, 'invoiced'],
    ...(a.acceptedQuotes != null ? [['Future quotes', a.acceptedQuotes, 'quotes']] : []),
    [`Recurring (${a.remainingMonths != null ? a.remainingMonths + ' mo' : 'rest of yr'})`, a.recurringRest || 0, 'recur'],
  ];
  const pctOf = (v) => ag ? Math.max(0, Math.min(100, (v / ag) * 100)) : 0;
  const gap = (ag != null && proj != null) ? ag - proj : null;
  const bar = segs.map(([, v, cls]) => v > 0 ? `<div class="vqa-seg ${cls}" style="width:${pctOf(v)}%"></div>` : '').join('');
  const legend = segs.map(([label, v, cls]) => `<span class="vqa-leg"><span class="vqa-sw ${cls}"></span>${esc(label)} <b>${moneyK(v || 0)}</b></span>`).join('');
  const annualBody = `
    <div class="vqa">
      <div class="vqa-top">
        <div class="vqa-amt">${proj != null ? moneyK(proj) : '—'} <span class="vqa-amt-sub">projected</span></div>
        <div class="vqa-gap ${gap != null && gap <= 0 ? 'good' : ''}">${gap == null ? '' : (gap <= 0 ? 'beats goal by ' + moneyK(-gap) : moneyK(gap) + ' to go')} · goal ${ag ? moneyK(ag) : '—'}</div>
      </div>
      <div class="vqa-bar">${bar}</div>
      <div class="vqa-legend">${legend}</div>
      ${a.acceptedQuotes == null ? `<div class="vq-note">Quotes unavailable (Xero scope) — projection excludes signed quotes.</div>` : ''}
    </div>`;
  // Vision (EOS top half) leads the tab; then the 1-Year Plan (annual revenue +
  // goals), the quarter breakdown, and finally the quarterly Rocks.
  let h = vision ? scVisionHtml(vision) : '';
  h += scCard(`${vq.year} — Annual Revenue`, annualBody, {key:'scale-vq-annual'});
  if(vision) h += scYearGoalsHtml(vision);

  // 2. Four quarter cards (click to filter the MOCs section)
  const cards = (vq.quarters||[]).map(q=>{
    const sel = q.n === _vtoSelQ;
    if(q.state==='future'){
      return `<div class="vq-card future${sel?' sel':''}" onclick="vtoSelectQuarter(${q.n})"><div class="vq-card-q">Q${q.n}</div><div class="vq-tbd">To be determined</div></div>`;
    }
    const pct = (q.goal && q.actual!=null) ? Math.min(100, Math.round((q.actual/q.goal)*100)) : null;
    const rs = q.rockStats;
    const rockLine = rs ? `<div class="vq-rocks">${rs.completed}/${rs.committed} rocks · ${rs.rate}%${rs.frozen?' 🔒':''}</div>` : '';
    return `<div class="vq-card${sel?' sel':''}${q.state==='current'?' current':''}" onclick="vtoSelectQuarter(${q.n})">
      <div class="vq-card-head"><span class="vq-card-q">Q${q.n}</span>${q.state==='current'?'<span class="vq-now">NOW</span>':''}</div>
      <div class="vq-amt">${q.actual!=null?moneyK(q.actual):'—'}</div>
      <div class="vq-goal">of ${q.goal?moneyK(q.goal):'—'}</div>
      <div class="vq-bar sm"><i style="width:${pct||0}%"></i></div>
      ${rockLine}
    </div>`;
  }).join('');
  h += `<div class="vq-grid">${cards}</div>`;

  // 3. Rocks for the selected quarter — live (editable) or frozen from the snapshot.
  const selLabel = `${vq.year} Q${_vtoSelQ}`;
  const qMeta = (vq.quarters||[]).find(q=>q.label===selLabel);
  const stats = qMeta?.rockStats;
  const frozen = !!stats?.frozen;
  const nextQ = scNextQuarter(selLabel);
  let rocksBody, rockCount, tone;

  if(frozen){
    // Closed quarter → immutable review snapshot.
    const rows = (vq.reviews||[]).filter(r=>r.quarter===selLabel);
    rocksBody = `<div class="rocks">`+ rows.map(rv=>{
      const dn = rv.finalStatus==='Completed';
      const col = dn?'var(--green)':'var(--red)';
      const w = rv.finalPct==null?0:Math.max(2,Math.min(100,rv.finalPct));
      const meta=[rv.owner?('Owner: '+esc(rv.owner)):null, rv.disposition?esc(rv.disposition):null].filter(Boolean).join(' · ');
      return `<div class="rock" style="border-left:3px solid ${col}">
        <div class="rock-top"><div><div class="rock-name">${esc(rv.name)}</div><div class="rock-meta">${meta}</div></div><span class="badge" style="background:${dn?'var(--green-soft)':'var(--red-soft)'};color:${col};flex-shrink:0">${dn?'COMPLETED':'MISSED'}</span></div>
        <div class="rock-prog"><div class="rock-bar"><i style="width:${w}%;background:${col}"></i></div><span class="rock-pct" style="color:${col}">${rv.finalPct==null?'—':rv.finalPct+'%'}</span></div>
      </div>`;
    }).join('') + `</div><div class="vq-note">🔒 ${esc(selLabel)} is closed — these scores are frozen history and won't change.</div>`;
    rockCount = `${stats.completed}/${stats.committed} done · ${stats.rate}%`;
    tone = stats.rate>=70?'green':(stats.missed?'red':'zone');
  } else {
    const rocks = (d.vto?.rocks||[]).filter(r=>r.quarter===selLabel).filter(scaleMine);
    const off = rocks.filter(r=>r.status==='offTrack'||r.status==='atRisk').length;
    const allRocks = d.vto?.rocks||[];
    rocksBody = rocks.length
      ? `<div class="rocks">`+ rocks.map(r=>{
          const [label,cls]=ROCK_BADGE[r.status]||['',''];
          const w = r.pct==null?0:Math.max(2,Math.min(100,r.pct));
          const metaBits=[r.owner?('Owner: '+esc(r.owner)):null, r.function?esc(r.function):null, (r.milestonesTotal?`${r.milestonesDone}/${r.milestonesTotal} milestones`:null), r.dueDate?('Due '+relDate(r.dueDate)):null].filter(Boolean).join(' · ');
          const origin = r.continuesId ? allRocks.find(x=>x.id===r.continuesId) : null;
          const lineage = r.continuesId ? `<span class="rock-lineage">↳ carried from ${origin?esc(origin.quarter||'a prior quarter'):'a prior quarter'}</span>` : '';
          const dispOpts = ['','Completed','Missed','Carried over','Rolled into new','Dropped'].map(o=>`<option value="${o}" ${(r.disposition||'')===o?'selected':''}>${o||'Set outcome…'}</option>`).join('');
          return `<div class="rock ${ROCK_BORDER[r.status]||'l-gray'}${r.disposition==='Dropped'?' dropped':''}">
            <div class="rock-top"><div><div class="rock-name"><span class="rock-link" onclick="scOpenRock('${r.id}')" title="Edit rock">${esc(r.name)}</span>${lineage}</div><div class="rock-meta">${metaBits}</div></div><span class="badge ${cls}" style="flex-shrink:0">${label}</span></div>
            <div class="rock-prog"><div class="rock-bar"><i style="width:${w}%;background:${rockBarColor(r.status)}"></i></div><span class="rock-pct" style="color:${rockBarColor(r.status)}">${r.pct==null?'—':r.pct+'%'}</span></div>
            ${r.nextAction?`<div class="rock-next">→ ${esc(r.nextAction)}</div>`:''}
            <div class="rock-foot">
              <select class="rock-disp" title="Quarter-end outcome" onchange="scSetRockDisposition('${r.id}', this.value)">${dispOpts}</select>
              <button class="rock-carry" onclick="scCarryRock('${r.id}','${esc(selLabel)}')" title="Score this rock &amp; clone it into ${esc(nextQ)}">Carry to Q${nextQ.slice(-1)} →</button>
            </div>
          </div>`;
        }).join('') + `</div>`
          + `<button class="add-issue-btn" style="margin-top:12px" onclick="scCloseQuarter('${esc(selLabel)}')">🔒 Close ${esc(selLabel)} — freeze final scores</button>`
      : `<div class="empty-line">No rocks for ${esc(selLabel)} in PROJECTS [DB].</div>`;
    rockCount = rocks.length ? `${stats.completed}/${stats.committed} done · ${stats.rate}%${off?` · ${off} off track`:''}` : '0 rocks';
    tone = off?'red':(stats&&stats.rate>=70?'green':'zone');
  }
  h += scCard(`${esc(selLabel)} Rocks`, rocksBody, {count:rockCount, tone, key:'scale-rocks'});

  // 4. EOS links out (no duplication — scorecard + issues are their own tabs)
  h += `<div class="vq-links"><button class="vq-link" onclick="showTab('scorecard')">View Scorecard →</button><button class="vq-link" onclick="showTab('issues')">Review Issues →</button></div>`;

  el.innerHTML = h;
}

// Click a rock title → the shared Edit Project modal (project-modal.js), same as
// the Today page. Rocks are work projects; saving re-fetches so the card updates.
function scOpenRock(id){
  if(!window.openProjectModal) return;
  const r=(window.DATA?.vto?.rocks||[]).find(x=>x.id===id); if(!r) return;
  openProjectModal({
    id, name:r.name, source:'work',
    status:r.notionStatus||'', end:r.dueDate||null, url:r.notionUrl||'',
  }, { onSaved:()=>load() });
}
// Next quarter label after "2026 Q2" → "2026 Q3" (Q4 rolls to next year Q1).
function scNextQuarter(label){
  const m=String(label).match(/(\d{4})\s*Q([1-4])/i); if(!m) return label;
  let y=+m[1], q=+m[2]+1; if(q>4){ q=1; y++; } return `${y} Q${q}`;
}
async function scSetRockDisposition(id, val){
  try{
    const r=await fetch('/api/scale/rock/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({disposition:val||null})});
    const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'failed');
    toast(val?('Outcome: '+val):'Outcome cleared'); load();
  }catch(e){ toast("Couldn't update: "+e.message); }
}
async function scCarryRock(id, fromLabel){
  const to=scNextQuarter(fromLabel);
  if(!confirm(`Carry this rock into ${to}?\n\nThe original stays in ${fromLabel} marked "Carried over" (it counts against ${fromLabel}'s completion rate), and a new linked rock is created in ${to}.`)) return;
  try{
    const r=await fetch('/api/scale/rock/'+id+'/carry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({toQuarter:to})});
    const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'failed');
    toast('Carried into '+to); load();
  }catch(e){ toast("Couldn't carry: "+e.message); }
}
async function scCloseQuarter(label){
  if(!confirm(`Close ${label}?\n\nThis freezes every rock's final score into an immutable snapshot. Completed = done; everything else = missed (Dropped rocks are excluded). You can still carry rocks forward afterward, but ${label}'s completion rate is locked.`)) return;
  try{
    const r=await fetch('/api/scale/quarter/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quarter:label})});
    const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'failed');
    toast(`${label} closed — ${d.completed}/${d.snapshotted} completed`); load();
  }catch(e){ toast("Couldn't close: "+e.message); }
}
function unavail(title,msg){ return `<div class="unavail"><b>${esc(title)}</b>${esc(msg)}</div>`; }

function renderBadges(d){
  const set=(id,n,show)=>{ const e=document.getElementById(id); if(!e)return; if(show && n){ e.textContent=n; e.style.display=''; } else e.style.display='none'; };
  const stressed = d.state==='stressed';
  set('badge-scorecard', d.scorecard?.offTrackCount||0, stressed);
  set('badge-systems', d.systems?.counts?.needsAttention||0, stressed);
  set('badge-issues', (d.pulse?.autoFlags||[]).length + (d.pulse?.teamIssues||[]).filter(scaleMine).length, stressed);
  set('badge-vto', (d.vto?.rocks||[]).filter(scaleMine).filter(r=>r.status==='offTrack'||r.status==='atRisk').length, stressed);
}

function renderAll(d){
  document.body.setAttribute('data-state', d.state||'stressed');
  renderBadges(d);
  renderPulse(d); renderScorecard(d); renderFinance(d); renderSystems(d); renderIssues(d); renderVto(d);
  if(window.restoreCards) restoreCards();
  restoreScaleTab();
  const t = d.refreshedAt? new Date(d.refreshedAt).toLocaleString('en-US',{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';
  document.getElementById('refreshed').textContent = `REFRESHED ${t} · Scale — LRL OS`;
  document.getElementById('sc-loading').style.display='none';
  document.getElementById('sc-content').style.display='block';
}

async function load(fresh){
  try {
    const r = await fetch('/api/scale/data' + (fresh ? '?fresh=1' : ''));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    DATA = d; renderAll(d);
  } catch(e){
    document.getElementById('sc-loading').style.display='none';
    const er=document.getElementById('sc-error'); er.style.display='block'; er.textContent="Couldn't load Scale: "+e.message;
  }
}
load();
// Footer ↻ → cache-busting reload (server caches Xero/Notion data; a plain
// reload would keep serving a stale snapshot).
