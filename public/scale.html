<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LRL OS · Scale</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/cards.css">
<script defer src="/cards.js"></script>
<script defer src="/zone-scope.js"></script>
<style>
:root {
  --zone: var(--work); --zone-soft: var(--work-soft);
  /* --font-body / --font-display come from tokens.css (Inter, app-wide). */
  --radius: 12px; --radius-sm: 8px; --radius-xs: 5px;
}
.scale-page { max-width:920px; margin:0 auto; padding:24px 24px 100px; font-family:var(--font-body); font-size:14px; line-height:1.5; color:var(--text); }
.scotch { display:inline-block; } /* serif stretch removed — unified sans */

/* header */
.sc-head { margin-bottom:18px; }
.sc-eyebrow { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; }
.sc-title { font-weight:800; font-size:28px; line-height:1.05; letter-spacing:-.01em; color:var(--text); }
.sc-sub { font-size:12.5px; color:var(--text-2); margin-top:6px; max-width:620px; }

/* tabs */
.tab-bar { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:22px; overflow-x:auto; scrollbar-width:none; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 14px; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color .15s; font-family:var(--font-body); }
.tab-btn:hover { color:var(--text-2); }
.tab-btn.active { color:var(--zone); border-bottom-color:var(--zone); }
.tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; font-size:10px; font-weight:800; padding:0 5px; }
.tab-badge.red { background:var(--red-soft); color:var(--red); }
.tab-badge.amber { background:var(--amber-soft); color:var(--amber); }
body[data-state="calm"] .tab-badge { display:none; }

.tab-panel { display:none; }
.tab-panel.active { display:block; }
body:not([data-state]) #sc-content { display:none; }

/* state banner (PULSE) */
.statebanner { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:var(--radius); margin-bottom:22px; border:1px solid; }
.statebanner .bigicon { font-size:20px; }
.statebanner .txt h2 { font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:1px; }
.statebanner .txt p { font-size:12.5px; color:var(--text-2); }
body[data-state="stressed"] .statebanner { background:var(--amber-soft); border-color:rgba(235,180,84,.3); }
body[data-state="stressed"] .statebanner h2 { color:var(--amber); }
body[data-state="calm"] .statebanner { background:var(--green-soft); border-color:rgba(79,214,160,.25); padding:12px 16px; }
body[data-state="calm"] .statebanner h2 { color:var(--green); font-size:15px; }

/* hero / next-move */
.hero { border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px; }
body[data-state="stressed"] .hero { background:linear-gradient(135deg,var(--surface) 0%, #0E1626 100%); border-left:3px solid var(--zone); }
body[data-state="calm"] .hero { background:var(--surface); }
.hero .eyebrow { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
body[data-state="stressed"] .hero .eyebrow { color:var(--zone); }
body[data-state="calm"] .hero .eyebrow { color:var(--green); }
.hero h1 { font-family:var(--font-display); font-weight:700; font-size:21px; line-height:1.15; margin-bottom:4px; }
.hero .sub { font-size:11.5px; color:var(--text-3); margin-bottom:12px; }
.hero .why { font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:14px; }
.hero .next { font-size:12.5px; color:var(--text); background:var(--surface-2); border-left:3px solid var(--zone); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 13px; margin-bottom:14px; }
body[data-state="calm"] .hero .next { border-left-color:var(--green); }
.hero .next .lbl { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); display:block; margin-bottom:3px; }
.hero .meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.hero .meta .ie { font-size:11px; color:var(--text-3); } .hero .meta .ie b { color:var(--text-2); }

/* buttons */
.btn { font-family:var(--font-body); font-weight:600; font-size:12px; letter-spacing:.03em; padding:9px 16px; border-radius:8px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; transition:all .15s; text-decoration:none; }
.btn-primary { background:var(--zone); color:#fff; } .btn-primary:hover { filter:brightness(1.1); }
.btn-ghost { background:transparent; border-color:var(--border); color:var(--text-2); } .btn-ghost:hover { border-color:var(--text-3); color:var(--text); }
.btn-green { background:transparent; color:var(--green); border-color:var(--green); } .btn-green:hover { background:var(--green-soft); }

/* eyebrow section header */
.eyebrow-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.eyebrow { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); display:flex; align-items:center; gap:8px; }
.eyebrow.green { color:var(--green); }
.eyebrow.zone { color:var(--zone); }
.eyebrow-count { border-radius:99px; padding:2px 9px; font-size:11px; font-weight:700; }
.eyebrow-count.red { background:var(--red-soft); color:var(--red); } .eyebrow-count.amber { background:var(--amber-soft); color:var(--amber); } .eyebrow-count.green { background:var(--green-soft); color:var(--green); } .eyebrow-count.zone { background:var(--zone-soft); color:#7FA8FF; }

/* badges */
.badge { display:inline-flex; align-items:center; font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:5px; white-space:nowrap; }
.b-solid { background:var(--green-soft); color:var(--green); }
.b-on-track { background:var(--green-soft); color:var(--green); }
.b-functional { background:rgba(79,214,160,.05); color:var(--text-3); border:1px solid var(--border); }
.b-needs-rev { background:var(--amber-soft); color:var(--amber); }
.b-amber { background:var(--amber-soft); color:var(--amber); }
.b-needs-build { background:var(--zone-soft); color:#7FA8FF; }
.b-broken { background:var(--red-soft); color:var(--red); }
.b-missing { background:rgba(242,109,109,.08); color:var(--red); border:1px dashed rgba(242,109,109,.4); }
.b-urgent { background:var(--red-soft); color:var(--red); }
.b-normal { background:var(--zone-soft); color:#7FA8FF; }
.b-projected { background:var(--zone-soft); color:#7FA8FF; }
.b-leading { background:var(--zone-soft); color:#7FA8FF; border:1px solid rgba(37,99,235,.3); }
.b-lagging { background:var(--accent-soft); color:var(--accent); border:1px solid rgba(99,102,241,.3); }
.b-neutral { background:var(--surface-2); color:var(--text-3); border:1px solid var(--border); }
.b-quickwin { background:rgba(99,102,241,.13); color:#A5A8F5; }

/* issue list */
.issue-list { display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
.issue-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px; display:flex; align-items:flex-start; gap:11px; transition:border-color .15s; }
.issue-card:hover { border-color:var(--zone); }
.issue-body { flex:1; min-width:0; }
.issue-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
.issue-meta { font-size:11px; color:var(--text-3); }
.issue-tail { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.open-link { font-size:11px; font-weight:600; color:var(--zone); text-decoration:none; white-space:nowrap; } .open-link:hover { text-decoration:underline; }
.add-issue-btn { width:100%; padding:10px; background:none; border:1px dashed var(--border); border-radius:var(--radius-sm); color:var(--text-3); font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.03em; transition:all .15s; font-family:var(--font-body); }
.add-issue-btn:hover { border-color:var(--zone); color:var(--zone); }

.empty-state { text-align:center; padding:28px 20px; color:var(--text-3); font-size:13px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:18px; }
.empty-state .ei { font-size:26px; margin-bottom:8px; }
.empty-state .et { font-size:14px; font-weight:600; color:var(--green); margin-bottom:5px; }
.flag-card { display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--amber); border-radius:var(--radius-sm); padding:11px 14px; }
.flag-card.red { border-left-color:var(--red); }
.flag-card .fi { font-size:15px; line-height:1.2; }
.flag-card .ft { font-size:12.5px; color:var(--text); } .flag-card .fs { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }

/* scorecard */
.scorecard { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.sc-grid { display:grid; grid-template-columns:1fr 78px 86px 110px 116px; gap:12px; align-items:center; }
.sc-head-row { padding:9px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); }
.sc-head-row .lbl { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.sc-row { padding:11px 16px; border-bottom:1px solid var(--border-soft); transition:background .15s; }
.sc-row:last-child { border-bottom:none; } .sc-row:hover { background:var(--surface-2); }
.sc-name { font-size:13px; font-weight:600; color:var(--text); } .sc-cat { font-size:10px; color:var(--text-3); margin-top:1px; }
.sc-period { font-size:11px; color:var(--text-3); }
.sc-bar { height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.sc-bar i { display:block; height:100%; border-radius:99px; }
.sc-val { font-size:13px; font-weight:800; text-align:right; white-space:nowrap; }
.sc-val .g { font-size:10px; color:var(--text-3); font-weight:400; }
.c-green { color:var(--green); } .c-amber { color:var(--amber); } .c-red { color:var(--red); } .c-unknown { color:var(--text-3); }

/* finance */
.fin-grid-3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:14px; }
.fin-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
.fin-label { font-size:var(--fs-body); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; }
.fin-value { font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1; }
.fin-value.pos { color:var(--green); } .fin-value.warn { color:var(--amber); } .fin-value.neg { color:var(--red); }
/* Cash Capacity card (ported from the /index finance board) */
.cap-card { background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
.cap-label { font-size:var(--fs-caption); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--label,var(--text-2)); margin-bottom:8px; }
.cap-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.cap-months { font-size:44px; font-weight:800; color:var(--green); line-height:1; letter-spacing:-.02em; }
.cap-months span { font-size:16px; color:var(--text-3); font-weight:600; margin-left:4px; text-transform:uppercase; }
.cap-amount { font-size:20px; font-weight:800; color:var(--text); }
.cap-goal { font-size:12px; color:var(--text-3); margin-top:2px; }
.cap-bar { height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin:12px 0 6px; }
.cap-bar i { display:block; height:100%; background:var(--green); border-radius:4px; }
.cap-card.cap-warn .cap-months { color:var(--amber); } .cap-card.cap-warn .cap-bar i { background:var(--amber); }
.cap-card.cap-short .cap-months { color:var(--red); } .cap-card.cap-short .cap-bar i { background:var(--red); }
.cap-accts { font-size:12px; color:var(--text-3); margin-top:8px; padding-top:8px; border-top:1px solid var(--border-soft); }
.fin-sub { font-size:11px; color:var(--text-3); margin-top:6px; }
.fin-bar { margin-top:10px; height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.fin-bar i { display:block; height:100%; border-radius:99px; }
.fin-pct { font-size:11px; font-weight:700; margin-top:5px; }

.proj { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.proj-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.proj-title { font-size:13px; font-weight:700; color:var(--text); } .proj-subtitle { font-size:11px; color:var(--text-3); margin-top:2px; }
.proj-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.proj-item { background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; }
.proj-item .pl { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
.proj-item .pv { font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--text); }
.proj-item .ps { font-size:11px; color:var(--text-3); margin-top:2px; }
.proj-total { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.proj-total .tl { font-size:12px; color:var(--text-2); font-weight:600; } .proj-total .tsub { font-size:11px; color:var(--text-3); }
.proj-total .tv { font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--green); text-align:right; }
.proj-total .ton { font-size:11px; font-weight:700; color:var(--green); text-align:right; }
.xero-tip { font-size:11px; color:var(--text-2); background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 13px; margin-bottom:18px; border-left:3px solid var(--zone); }

.accounts { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.acc-head { display:flex; justify-content:space-between; padding:9px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); }
.acc-row { display:flex; justify-content:space-between; align-items:center; padding:9px 16px; border-bottom:1px solid var(--border-soft); font-size:13px; }
.acc-row:last-child { border-bottom:none; } .acc-row.total { background:var(--surface-2); }
.acc-name { color:var(--text-2); } .acc-name.bold { color:var(--text); font-weight:700; }
.acc-val { font-weight:700; color:var(--text); } .acc-val.pos { color:var(--green); } .acc-val.neg { color:var(--red); }
/* Inside the collapsible Bank accounts card, render flat tables (no nested-card
   chrome) — just the labeled rows + total. */
.t-card .accounts { background:transparent; border:none; border-radius:0; overflow:visible; }
.t-card .accounts + .accounts { margin-top:16px; }
.t-card .acc-head { padding-left:0; padding-right:0; background:none; }
.t-card .acc-row { padding-left:0; padding-right:0; }
.t-card .acc-row.total { background:none; }

.rev-chart { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.rev-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.rev-label { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); }
.rev-meta { font-size:11px; color:var(--text-3); }
.chart-bars { display:flex; align-items:flex-end; gap:6px; height:100px; }
.cb-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.cb-bar { width:100%; border-radius:3px 3px 0 0; min-height:2px; }
.cb-bar.above { background:var(--green); opacity:.75; }
.cb-bar.below { background:var(--zone); opacity:.45; }
.cb-bar.current { background:var(--zone); opacity:1; }
.cb-bar.proj { background:var(--green); opacity:.35; border:1px dashed rgba(79,214,160,.5); }
.cb-lbl { font-size:9px; color:var(--text-3); } .cb-lbl.current { color:#7FA8FF; font-weight:700; } .cb-lbl.proj { color:var(--green); }

/* systems */
.sys-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
.sys-stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; text-align:center; }
.sys-stat .n { font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1; margin-bottom:5px; }
.sys-stat .l { font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); }
.sys-list { display:flex; flex-direction:column; gap:7px; margin-bottom:22px; }
.sys-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 15px; display:flex; align-items:flex-start; gap:12px; border-left:3px solid transparent; transition:border-color .15s; }
.sys-card.l-red { border-left-color:var(--red); } .sys-card.l-amber { border-left-color:var(--amber); }
.sys-card:hover { border-color:var(--zone); }
.sys-body { flex:1; min-width:0; }
.sys-name-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px; }
.sys-name { font-size:13px; font-weight:600; color:var(--text); }
.sys-meta { font-size:11px; color:var(--text-3); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.sys-next { font-size:11.5px; color:var(--text-3); margin-top:6px; line-height:1.5; }
.maturity { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.md-dots { display:flex; gap:3px; } .md { width:6px; height:6px; border-radius:50%; background:var(--border); } .md.on { background:var(--green); } .md.mid { background:var(--amber); }
.md-lbl { font-size:9px; color:var(--text-3); }
.view-all-btn { width:100%; padding:10px; background:none; border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-3); font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; font-family:var(--font-body); }
.view-all-btn:hover { border-color:var(--text-3); color:var(--text-2); }

/* vto rocks */
.rocks { display:flex; flex-direction:column; gap:8px; margin-bottom:26px; }
.rock { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
.rock.l-green { border-left-color:var(--green); } .rock.l-amber { border-left-color:var(--amber); } .rock.l-red { border-left-color:var(--red); } .rock.l-gray { border-left-color:var(--border); }
.rock-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.rock-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:3px; }
.rock-meta { font-size:11px; color:var(--text-3); }
.rock-prog { display:flex; align-items:center; gap:10px; }
.rock-bar { flex:1; height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; } .rock-bar i { display:block; height:100%; border-radius:99px; }
.rock-pct { font-size:11px; font-weight:700; white-space:nowrap; }
.rock-next { font-size:11px; color:var(--text-3); margin-top:8px; }

.vto-divider { height:1px; background:var(--border); margin-bottom:22px; }
.vto-plan { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.vto-col-head { display:grid; grid-template-columns:1fr 84px 84px 104px; gap:12px; padding:8px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); }
.vto-col-head .l { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.vto-group-head { padding:6px 16px; background:var(--surface-2); border-bottom:1px solid var(--border-soft); }
.vto-group-head span { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--zone); }
body[data-state="calm"] .vto-group-head span { color:var(--green); }
.vto-row { display:grid; grid-template-columns:1fr 84px 84px 104px; gap:12px; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border-soft); background:var(--surface); }
.vto-row:last-child { border-bottom:none; }
.vto-mname { font-size:13px; font-weight:600; color:var(--text); } .vto-msub { font-size:10px; color:var(--text-3); margin-top:1px; }
.vto-cell { font-size:12px; color:var(--text-3); } .vto-cell.goal { color:var(--text-2); font-weight:600; }
.vto-actual { text-align:right; font-size:13px; font-weight:800; } .vto-actual .u { font-size:10px; color:var(--text-3); font-weight:400; }

.empty-line { font-size:12px; color:var(--text-3); padding:14px 4px; }
.unavail { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; color:var(--text-3); font-size:12.5px; }
.unavail b { color:var(--text-2); display:block; margin-bottom:4px; font-size:13px; }

#sc-loading { padding:60px 0; text-align:center; color:var(--text-3); font-size:13px; }
#sc-error { display:none; background:var(--red-soft); border:1px solid rgba(242,109,109,.25); color:var(--red); border-radius:var(--radius); padding:14px 18px; font-size:13px; margin-bottom:18px; }
.refreshed { text-align:center; padding:20px; font-size:11px; color:var(--text-4); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; z-index:999; transition:transform .25s,opacity .25s; opacity:0; pointer-events:none; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

@media(max-width:720px){
  .sys-summary { grid-template-columns:repeat(2,1fr); }
  .proj-grid { grid-template-columns:1fr; }
  .sc-grid { grid-template-columns:1fr auto; gap:6px 10px; }
  .sc-head-row { display:none; }
  .sc-row .sc-period, .sc-row .sc-type-cell { display:none; }
  .sc-row .sc-bar-cell { grid-column:1 / -1; }
  .vto-col-head { display:none; }
  .vto-row { grid-template-columns:1fr auto; gap:4px 10px; }
  .vto-row .vto-be, .vto-row .vto-goal { display:none; }
}
/* List sections wrapped in shared collapsible .t-card */
.tab-panel .t-card { margin-bottom:16px; }
.tab-panel .t-card .issue-list, .tab-panel .t-card .sys-list, .tab-panel .t-card .rocks, .tab-panel .t-card .accounts { margin-bottom:0; }
</style>
<script src="/sample-data.js"></script>
<script src="/privacy.js"></script>
</head><body>
<div id="lrl-shell"></div>

<div class="scale-page">
  <div class="sc-head">
    <span class="sc-title">Scale</span>
    <div class="sc-sub">The operating view — scorecard vs. targets, finances, issues, and the systems holding growth back.</div>
  </div>

  <div id="sc-error"></div>
  <div id="sc-loading">Loading the operating view…</div>

  <div id="sc-content" style="display:none">
    <div class="tab-bar" id="tab-bar">
      <button class="tab-btn active" data-tab="pulse" onclick="showTab('pulse')">PULSE <span class="tab-badge red" id="badge-pulse" style="display:none"></span></button>
      <button class="tab-btn" data-tab="scorecard" onclick="showTab('scorecard')">SCORECARD <span class="tab-badge red" id="badge-scorecard" style="display:none"></span></button>
      <button class="tab-btn" data-tab="finance" onclick="showTab('finance')">FINANCE</button>
      <button class="tab-btn" data-tab="systems" onclick="showTab('systems')">SYSTEMS <span class="tab-badge amber" id="badge-systems" style="display:none"></span></button>
      <button class="tab-btn" data-tab="vto" onclick="showTab('vto')">VTO <span class="tab-badge red" id="badge-vto" style="display:none"></span></button>
    </div>

    <div class="tab-panel active" id="tab-pulse"></div>
    <div class="tab-panel" id="tab-scorecard"></div>
    <div class="tab-panel" id="tab-finance"></div>
    <div class="tab-panel" id="tab-systems"></div>
    <div class="tab-panel" id="tab-vto"></div>

    <div class="refreshed" id="refreshed"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<a href="/" class="fab" title="Back to Today">⚡</a>

<script>
let DATA = null;
// Global ME toggle (shell.js): keep items assigned to me, plus unassigned ones.
// Issues carry `assigned` (name) + `mine`; rocks carry `owner` (name) + `mine`.
function scaleMine(x){ return !(window.LRLShell && LRLShell.meMode()) || x.mine || !(x.assigned || x.owner); }
window.onMeModeChange = function(){ if (DATA) renderAll(DATA); };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const money = (v) => v == null ? '—' : (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString();
const moneyK = (v) => { if (v == null) return '—'; const a = Math.abs(v); const s = v < 0 ? '−$' : '$'; return a >= 1000 ? s + (a/1000).toFixed(a >= 10000 ? 0 : 1) + 'k' : s + Math.round(a); };
const num = (v) => v == null ? '—' : Math.round(v).toLocaleString();
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2400); }

const CUR_SOURCES = ['Xero Revenue','Xero Profit','Convert Deals Won'];
function fmtMetricVal(m){
  const f=(v)=> v==null?'—': CUR_SOURCES.includes(m.source)? moneyK(v) : (m.source==='Xero Cash Capacity'? (Math.round(v*100)/100).toFixed(2) : num(v));
  return `${f(m.actual)} <span class="g">/ ${f(m.goal)}</span>`;
}
const barColor=(s)=> s==='green'?'var(--green)': s==='amber'?'var(--amber)': s==='red'?'var(--red)':'var(--text-4)';
const valClass=(s)=> s==='green'?'c-green': s==='amber'?'c-amber': s==='red'?'c-red':'c-unknown';
const HEALTH_BADGE={ 'Solid':'b-solid','Functional':'b-functional','Needs Review':'b-needs-rev','Needs Build':'b-needs-build','Broken':'b-broken','Missing':'b-missing' };
const healthBadge=(h)=> h?`<span class="badge ${HEALTH_BADGE[h]||'b-neutral'}">${esc(h)}</span>`:'';
const prioBadge=(p)=>{ const c= p==='URGENT'?'b-urgent': p==='HIGH'?'b-amber':'b-normal'; return `<span class="badge ${c}">${esc(p||'NORMAL')}</span>`; };
const sysPrioBadge=(p)=>{ const c= p==='Critical'?'b-urgent': p==='High'?'b-amber':'b-neutral'; return p?`<span class="badge ${c}">${esc(p)}</span>`:''; };
function maturityDots(n){ n=n||0; let h=''; for(let i=0;i<5;i++){ h+=`<div class="md ${i<n?(n<=2?'mid':'on'):''}"></div>`; } return `<div class="md-dots">${h}</div>`; }
function relDate(d){ if(!d) return null; const days=Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(new Date().toISOString().slice(0,10)+'T00:00:00Z'))/864e5); if(days===0)return'today'; if(days===1)return'tomorrow'; if(days<0)return `${-days}d overdue`; return `in ${days}d`; }

const ROCK_BORDER={ complete:'l-green', onTrack:'l-green', atRisk:'l-amber', offTrack:'l-red', notStarted:'l-gray' };
const ROCK_BADGE={ complete:['✓ COMPLETE','b-solid'], onTrack:['ON TRACK','b-on-track'], atRisk:['AT RISK','b-amber'], offTrack:['OFF TRACK','b-urgent'], notStarted:['NOT STARTED','b-neutral'] };
const rockBarColor=(s)=> (s==='offTrack')?'var(--red)':(s==='atRisk')?'var(--amber)':(s==='notStarted')?'var(--text-4)':'var(--green)';

function showTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  try { localStorage.setItem('scale-tab', name); } catch {}
}
// Restore the last tab the user was on (persists across leaving + returning to Scale).
function restoreScaleTab(){
  let t; try { t = localStorage.getItem('scale-tab'); } catch {}
  if (t && document.getElementById('tab-'+t)) showTab(t);
}

// ── PULSE ──
// Wrap a list section in a shared collapsible card (title inside, count on right).
function scCard(title, body, opts){
  opts = opts || {};
  const count = opts.count != null ? `<span class="eyebrow-count ${opts.tone||''}">${opts.count}</span>` : '';
  const key = opts.key ? ` data-persist-key="${opts.key}"` : '';
  return `<div class="t-card"${key}><div class="sec-head"><div class="card-toggle" onclick="toggleCard(this)"><span class="chev">▾</span><div class="sec-title">${title}</div></div>${count}</div><div class="t-body">${body}</div></div>`;
}

function renderPulse(d){
  const calm = d.state==='calm';
  const flags = d.pulse?.autoFlags||[];
  const issues = (d.pulse?.teamIssues||[]).filter(scaleMine);
  const hero = d.pulse?.heroIssue;
  let h='';

  // state banner
  if(calm){
    h += `<div class="statebanner"><span class="bigicon">✓</span><div class="txt"><h2 class="scotch">The machine is running</h2><p>Scorecard on track · ${issues.length} planning item${issues.length===1?'':'s'} · all critical systems healthy.</p></div></div>`;
  } else {
    const parts=[];
    if(d.scorecard?.offTrackCount) parts.push(`${d.scorecard.offTrackCount} metric${d.scorecard.offTrackCount>1?'s':''} off-track`);
    if(d.systems?.counts?.needsAttention) parts.push(`${d.systems.counts.needsAttention} system${d.systems.counts.needsAttention>1?'s':''} need attention`);
    if(flags.length) parts.push(`${flags.length} auto-flag${flags.length>1?'s':''}`);
    h += `<div class="statebanner"><span class="bigicon">🛠️</span><div class="txt"><h2 class="scotch">The machine needs work</h2><p>${esc(parts.join(' · ')||'Review the flags below')}. Fix the highest-leverage one first.</p></div></div>`;
  }

  // hero / next-move
  if(hero){
    if(hero.kind==='flag'){
      h += `<div class="hero"><div class="eyebrow">⚡ Highest-leverage fix</div><h1 class="scotch">${esc(hero.message)}</h1><p class="sub">Auto-flag · ${esc(hero.source)}</p></div>`;
    } else if(hero.kind==='rock'){
      h += `<div class="hero"><div class="eyebrow">⚡ Highest-leverage fix</div><h1 class="scotch">${esc(hero.name)}</h1><p class="sub">Rock · ${hero.pct}% complete · off track</p>${hero.nextAction?`<div class="next"><span class="lbl">Next action</span>${esc(hero.nextAction)}</div>`:''}${hero.notionUrl?`<div class="meta"><a class="btn btn-primary" href="${esc(hero.notionUrl)}" target="_blank">→ Open in Notion</a></div>`:''}</div>`;
    } else {
      const growth = hero.framing==='growth';
      h += `<div class="hero">
        <div class="eyebrow">${growth?'✦ Next growth move':'⚡ Highest-leverage fix'}</div>
        <h1 class="scotch">${esc(hero.name)}</h1>
        <p class="sub">${esc(hero.func||'Business system')} · ${esc(hero.health||'')}${hero.quickWin?' · quick win':''}</p>
        ${hero.whatsMissing?`<div class="why">${esc(hero.whatsMissing)}</div>`:''}
        ${hero.nextActions?`<div class="next"><span class="lbl">Next action</span>${esc(hero.nextActions)}</div>`:''}
        <div class="meta">
          ${sysPrioBadge(hero.priority)} ${healthBadge(hero.health)} ${hero.quickWin?'<span class="badge b-quickwin">Quick win</span>':''}
          <span class="ie">Impact <b>${hero.impact??'—'}/5</b></span><span class="ie">Effort <b>${hero.effort??'—'}/5</b></span>
          ${hero.url?`<a class="btn ${growth?'btn-green':'btn-primary'}" style="margin-left:auto" href="${esc(hero.url)}" target="_blank">→ Open in Notion</a>`:''}
        </div>
      </div>`;
    }
  }

  // auto-flags (stressed only — calm shows the green empty state instead)
  if(flags.length){
    const flagsBody = `<div class="issue-list">`+ flags.map(f=>`
      <div class="flag-card ${f.severity==='red'?'red':''}"><span class="fi">${f.severity==='red'?'🔴':'🟡'}</span><div><div class="ft">${esc(f.message)}</div><div class="fs">${esc(f.source)}</div></div></div>`).join('') +`</div>`;
    h += scCard('⚑ Auto-flags', flagsBody, {count:flags.length, tone:'red', key:'scale-flags'});
  }

  // IDS queue
  const issuesBody = issues.length
    ? `<div class="issue-list">`+ issues.map(i=>{
        const meta=[i.assigned?('Assigned '+esc(i.assigned)):null, i.status?('Status: '+esc(i.status)):null, i.due?relDate(i.due):'No due date'].filter(Boolean).join(' · ');
        return `<div class="issue-card">${prioBadge(i.priority)}<div class="issue-body"><div class="issue-name">${esc(i.name)}</div><div class="issue-meta">${meta}</div></div><div class="issue-tail">${i.notionUrl?`<a class="open-link" href="${esc(i.notionUrl)}" target="_blank">→ Open</a>`:''}</div></div>`;
      }).join('') +`</div>`
    : `<div class="empty-line">No open issues in the IDS queue.</div>`;
  h += scCard('Issues — IDS queue', issuesBody, {count:issues.length, tone:calm?'green':'zone', key:'scale-issues'});

  if(calm && !flags.length){
    h += `<div class="empty-state"><div class="ei">✓</div><div class="et">No auto-flags</div><div>Scorecard metrics are on track. No critical system gaps. Revenue pacing to goal.</div></div>`;
  }

  h += `<button class="add-issue-btn" onclick="toast('Add an issue in Notion → ISSUES [DB]')">+ Add issue to IDS queue</button>`;
  document.getElementById('tab-pulse').innerHTML = h;
}

// ── SCORECARD ──
function renderScorecard(d){
  const el = document.getElementById('tab-scorecard');
  if(!d.scorecard){ el.innerHTML = unavail('Scorecard unavailable','Could not load the VTO scorecard metrics.'); return; }
  const metrics = d.scorecard.metrics||[];
  const off = d.scorecard.offTrackCount||0;
  let h = `<div class="eyebrow-row"><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:13px;font-weight:700;color:var(--text-2)">${esc(d.scorecard.quarter)} Scorecard</span><span class="badge ${off?'b-amber':'b-on-track'}">${off?off+' off-track':'on track'}</span></div><div style="display:flex;gap:8px;"><span class="badge b-leading">→ Leading</span><span class="badge b-lagging">← Lagging</span></div></div>`;
  if(!metrics.length){ el.innerHTML = h + `<div class="empty-line">No wired scorecard metrics for this quarter.</div>`; return; }
  h += `<div class="scorecard"><div class="sc-grid sc-head-row"><div class="lbl">Metric</div><div class="lbl">Period</div><div class="lbl">Type</div><div class="lbl">Progress</div><div class="lbl" style="text-align:right">Actual / Goal</div></div>`;
  h += metrics.map(m=>{
    const w = m.pct==null?0:Math.max(2,Math.min(100,m.pct));
    const typeBadge = m.type==='leading'?'<span class="badge b-leading">→ leading</span>':'<span class="badge b-lagging">← lagging</span>';
    return `<div class="sc-grid sc-row">
      <div><div class="sc-name">${esc(m.metric)}</div><div class="sc-cat">${esc(m.category||'')}</div></div>
      <div class="sc-period">${esc(m.period||'')}</div>
      <div class="sc-type-cell">${typeBadge}</div>
      <div class="sc-bar-cell"><div class="sc-bar"><i style="width:${w}%;background:${barColor(m.status)}"></i></div></div>
      <div class="sc-val ${valClass(m.status)}">${fmtMetricVal(m)}</div>
    </div>`;
  }).join('');
  h += `</div><div style="font-size:11px;color:var(--text-3);text-align:center;margin-top:4px;">Actuals computed live from Xero + Convert/Speaking activity.</div>`;
  el.innerHTML = h;
}

// ── FINANCE ──
// Reads the SAME source as the /index finance board (/api/finance/xero, the raw
// computeXeroFinance), so the numbers match exactly — incl. Cash on Hand from the
// sum of bank accounts (bankTotal), not Xero's netted "Total" row.
let _finRaw = null, _finLoading = false;
function renderFinance(){
  const el = document.getElementById('tab-finance');
  if (_finRaw) { finBoard(el, _finRaw); return; }
  if (_finLoading) return;
  _finLoading = true;
  el.innerHTML = `<div style="padding:22px 4px;color:var(--text-3);font-size:13px;text-align:center;">Loading finance…</div>`;
  fetch('/api/finance/xero').then(r => r.json()).then(d => {
    _finLoading = false;
    if (!d || d.error) { el.innerHTML = unavail('Finance unavailable', d && d.needsAuth ? 'Connect Xero at /auth/xero to populate cash, runway, and revenue.' : 'Could not load Xero data.'); return; }
    _finRaw = d; finBoard(el, d);
  }).catch(() => { _finLoading = false; el.innerHTML = unavail('Finance unavailable', 'Could not load Xero data.'); });
}

function finBoard(el, d){
  const pctClass = (p) => p >= 90 ? 'c-green' : p >= 65 ? 'c-amber' : 'c-red';
  const card = (label, val, sub, cls) => `<div class="fin-card"><div class="fin-label">${label}</div><div class="fin-value ${cls||''}">${val}</div><div class="fin-sub">${sub||''}</div></div>`;
  const revCard = (label, actual, goalObj) => {
    const goal = goalObj && goalObj.goal || 0;
    const p = goal ? Math.round((actual / goal) * 100) : null;
    const w = p == null ? 0 : Math.max(2, Math.min(100, p));
    const c = p == null ? '' : (p >= 90 ? 'pos' : p >= 65 ? 'warn' : 'neg');
    return `<div class="fin-card"><div class="fin-label">${label}</div><div class="fin-value ${c}">${moneyK(actual)}</div><div class="fin-sub">vs ${moneyK(goal)} goal</div><div class="fin-bar"><i style="width:${w}%;background:${p==null?'var(--text-4)':(p>=90?'var(--green)':p>=65?'var(--amber)':'var(--red)')}"></i></div><div class="fin-pct ${p==null?'':pctClass(p)}">${p==null?'—':p+'%'}</div></div>`;
  };
  const nBank = (d.bankAccounts || []).length, nCard = (d.creditCards || []).length;

  // Cash Capacity as a regular fin-card
  const cc = d.cashCapacity || {}; const ccM = cc.months ?? 0;
  const capCls = ccM >= 3 ? 'pos' : ccM >= 1 ? 'warn' : 'neg';
  const capBg = ccM >= 3 ? 'var(--green)' : ccM >= 1 ? 'var(--amber)' : 'var(--red)';
  const capCard = `<div class="fin-card">
    <div class="fin-label">Cash Capacity</div>
    <div class="fin-value ${capCls}">${ccM}<span style="font-size:12px;font-weight:600;margin-left:2px;color:var(--text-3)">mo</span></div>
    <div class="fin-sub">${money(cc.amount)} / ${money(cc.goalAmount||90000)} goal</div>
    <div class="fin-bar"><i style="width:${Math.min(100,cc.pctToGoal||0)}%;background:${capBg}"></i></div>
    ${cc.accountsFound === false ? `<div style="font-size:10px;color:var(--amber);margin-top:4px">⚠ Check Xero account names</div>` : ''}
  </div>`;

  let h = `<div class="fin-grid-3">
    ${card('Cash on Hand', moneyK(d.bankTotal), `${nBank} account${nBank===1?'':'s'}`, (d.bankTotal||0)<0?'neg':'')}
    ${capCard}
    ${card('Credit Cards', moneyK(d.creditTotal), `${nCard} card${nCard===1?'':'s'}`, (d.creditTotal||0)<0?'warn':'')}
    ${card('A/R — Owed to Us', moneyK(d.accountsReceivable), 'outstanding invoices')}
    ${card('MTD Net', moneyK(d.mtdNet), (d.mtdNet||0)>=0?'in the black':'in the red', (d.mtdNet||0)>=0?'pos':'neg')}
  </div>`;

  h += `<div class="eyebrow-row"><span class="eyebrow">Revenue tracking</span></div>`;
  h += `<div class="fin-grid-3">${revCard('YTD Revenue', d.ytdRevenue, d.goals?.revenue?.ytd)}${revCard('QTD Revenue', d.qtdRevenue, d.goals?.revenue?.qtd)}${revCard('MTD Revenue', d.mtdRevenue, d.goals?.revenue?.mtd)}</div>`;

  // Bank + credit-card accounts
  let bankBody = '';
  if (nBank) {
    bankBody += `<div class="accounts"><div class="acc-head"><span>Account</span><span>Balance</span></div>`
      + d.bankAccounts.map(a => `<div class="acc-row"><span class="acc-name">${esc(a.name)}</span><span class="acc-val">${money(a.balance)}</span></div>`).join('')
      + `<div class="acc-row total"><span class="acc-name bold">Total</span><span class="acc-val pos">${money(d.bankTotal)}</span></div></div>`;
  }
  if (nCard) {
    bankBody += `<div class="accounts"><div class="acc-head"><span>Credit Card</span><span>Balance</span></div>`
      + d.creditCards.map(a => `<div class="acc-row"><span class="acc-name">${esc(a.name)}</span><span class="acc-val neg">${money(a.balance)}</span></div>`).join('') + `</div>`;
  }
  if (bankBody) h += scCard('Bank accounts', bankBody, { key: 'scale-bank' });

  if (d.asOf) h += `<div style="font-size:11px;color:var(--text-4);text-align:center;margin-top:4px;">As of ${new Date(d.asOf).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>`;
  el.innerHTML = h;
  if (window.restoreCards) restoreCards();
}

// ── SYSTEMS ──
function renderSystems(d){
  const el = document.getElementById('tab-systems');
  if(!d.systems){ el.innerHTML = unavail('Systems unavailable','Could not load the business functions board.'); return; }
  const c = d.systems.counts||{};
  const calm = d.state==='calm';
  let h = `<div class="sys-summary">
    <div class="sys-stat"><div class="n" style="color:${c.critical?'var(--red)':'var(--text-3)'}">${c.critical||0}</div><div class="l">Critical</div></div>
    <div class="sys-stat"><div class="n" style="color:${c.brokenMissing?'var(--red)':'var(--text-3)'}">${c.brokenMissing||0}</div><div class="l">Broken / Missing</div></div>
    <div class="sys-stat"><div class="n c-amber">${c.needsAttention||0}</div><div class="l">Needs Attention</div></div>
    <div class="sys-stat"><div class="n c-green">${c.healthy||0}</div><div class="l">Healthy</div></div>
  </div>`;

  const sysCard=(s)=>`<div class="sys-card ${s.health==='Broken'||s.health==='Missing'?'l-red':'l-amber'}">
    <div class="sys-body"><div class="sys-name-row"><span class="sys-name">${esc(s.name)}</span>${healthBadge(s.health)}${sysPrioBadge(s.priority)}${s.quickWin?'<span class="badge b-quickwin">Quick win</span>':''}</div>
    <div class="sys-meta">${esc(s.func||'')}<span class="ie">Impact <b>${s.impact??'—'}</b></span><span class="ie">Effort <b>${s.effort??'—'}</b></span></div>
    ${s.nextActions?`<div class="sys-next"><b style="color:var(--text-2)">Next:</b> ${esc(s.nextActions)}</div>`:''}</div>
    <div class="maturity">${maturityDots(s.maturity)}<div class="md-lbl">${s.maturity??'—'} / 5</div></div></div>`;
  const healthyCard=(s)=>`<div class="sys-card"><div class="sys-body"><div class="sys-name-row"><span class="sys-name">${esc(s.name)}</span>${healthBadge(s.health)}</div><div class="sys-meta">${esc(s.func||'')}</div></div><div class="maturity">${maturityDots(s.maturity)}<div class="md-lbl">${s.maturity??'—'} / 5</div></div></div>`;

  const fixFirst = d.systems.fixFirst||[];
  const quickWins = d.systems.quickWins||[];
  const needsReview = d.systems.needsReview||[];
  const healthy = d.systems.healthy||[];

  // Calm leads with healthy; stressed leads with fix-first.
  const fixSection = () => {
    let s='';
    if(fixFirst.length){ s+=scCard('Fix first — critical', `<div class="sys-list">${fixFirst.map(sysCard).join('')}</div>`, {count:fixFirst.length, tone:'red', key:'scale-fixfirst'}); }
    if(quickWins.length){ s+=scCard('Quick wins — high impact, low effort', `<div class="sys-list">${quickWins.map(sysCard).join('')}</div>`, {count:quickWins.length, tone:'zone', key:'scale-quickwins'}); }
    if(needsReview.length){ s+=scCard('Needs review', `<div class="sys-list">${needsReview.map(sysCard).join('')}</div>`, {count:needsReview.length, tone:'amber', key:'scale-needsreview'}); }
    if(!fixFirst.length && !quickWins.length && !needsReview.length){ s+=`<div class="empty-line">Every business system is healthy. ✓</div>`; }
    return s;
  };
  const healthySection = () => {
    if(!healthy.length) return '';
    const shown = healthy.slice(0,5);
    let body=`<div class="sys-list">${shown.map(healthyCard).join('')}</div>`;
    if(healthy.length>5) body+=`<button class="view-all-btn" onclick="toast('Open BUSINESS FUNCTIONS [DB] in Notion')">+ ${healthy.length-5} more healthy systems</button>`;
    return scCard('Healthy systems', body, {count:healthy.length, tone:'green', key:'scale-healthy'});
  };

  h += calm ? (healthySection()+fixSection()) : (fixSection()+healthySection());
  el.innerHTML = h;
}

// ── VTO ──
function renderVto(d){
  const el = document.getElementById('tab-vto');
  const rocks = (d.vto?.rocks||[]).filter(scaleMine);
  const off = rocks.filter(r=>r.status==='offTrack'||r.status==='atRisk').length;
  const done = rocks.filter(r=>r.status==='complete').length;
  const rocksBody = rocks.length
    ? `<div class="rocks">`+ rocks.map(r=>{
        const [label,cls]=ROCK_BADGE[r.status]||['',''];
        const w = r.pct==null?0:Math.max(2,Math.min(100,r.pct));
        const metaBits=[r.owner?('Owner: '+esc(r.owner)):null, r.function?esc(r.function):null, (r.milestonesTotal?`${r.milestonesDone}/${r.milestonesTotal} milestones`:null), r.dueDate?('Due '+relDate(r.dueDate)):null].filter(Boolean).join(' · ');
        return `<div class="rock ${ROCK_BORDER[r.status]||'l-gray'}">
          <div class="rock-top"><div><div class="rock-name">${r.notionUrl?`<a href="${esc(r.notionUrl)}" target="_blank" style="color:inherit;text-decoration:none">${esc(r.name)}</a>`:esc(r.name)}</div><div class="rock-meta">${metaBits}</div></div><span class="badge ${cls}" style="flex-shrink:0">${label}</span></div>
          <div class="rock-prog"><div class="rock-bar"><i style="width:${w}%;background:${rockBarColor(r.status)}"></i></div><span class="rock-pct" style="color:${rockBarColor(r.status)}">${r.pct==null?'—':r.pct+'%'}</span></div>
          ${r.nextAction?`<div class="rock-next">→ ${esc(r.nextAction)}</div>`:''}
        </div>`;
      }).join('') +`</div>`
    : `<div class="empty-line">No rocks flagged for this quarter in PROJECTS [DB].</div>`;
  let h = scCard(`${esc(d.vto?.quarter||'')} Rocks`, rocksBody, {count:(off?off+' off track':(done?done+' done':rocks.length)), tone:off?'red':(done?'green':'zone'), key:'scale-rocks'});

  // 1-year plan (scorecard metrics grouped by category)
  const metrics = d.vto?.metrics||[];
  if(metrics.length){
    h += `<div class="vto-divider"></div><div class="eyebrow-row"><span class="eyebrow ${d.state==='calm'?'green':'zone'}">VTO — 1-Year Plan</span></div>`;
    h += `<div class="vto-plan"><div class="vto-col-head"><div class="l">Metric</div><div class="l">Break Even</div><div class="l">Goal</div><div class="l" style="text-align:right">Actual</div></div>`;
    const groups = {};
    metrics.forEach(m=>{ const g=m.category||'Other'; (groups[g]=groups[g]||[]).push(m); });
    h += Object.entries(groups).map(([g,ms])=>`
      <div class="vto-group-head"><span>${esc(g)}</span></div>`+
      ms.map(m=>{
        const fmt=(v)=> v==null?'—': CUR_SOURCES.includes(m.source)?moneyK(v): (m.source==='Xero Cash Capacity'?(Math.round(v*100)/100).toFixed(2):num(v));
        const dir = m.direction? esc(m.direction) : '';
        return `<div class="vto-row">
          <div><div class="vto-mname">${esc(m.metric)}</div><div class="vto-msub">${esc(m.cadence||'')}${m.source?' · '+esc(m.source):''}${dir?' · '+dir:''}</div></div>
          <div class="vto-cell vto-be">${m.breakEven==null?'—':fmt(m.breakEven)}</div>
          <div class="vto-cell goal vto-goal">${fmt(m.goal)}</div>
          <div class="vto-actual ${valClass(m.status)}">${fmt(m.actual)}</div>
        </div>`;
      }).join('')
    ).join('');
    h += `</div>`;
  }
  el.innerHTML = h;
}

function unavail(title,msg){ return `<div class="unavail"><b>${esc(title)}</b>${esc(msg)}</div>`; }

function renderBadges(d){
  const set=(id,n,show)=>{ const e=document.getElementById(id); if(!e)return; if(show && n){ e.textContent=n; e.style.display=''; } else e.style.display='none'; };
  const stressed = d.state==='stressed';
  set('badge-pulse', (d.pulse?.teamIssues||[]).filter(scaleMine).length, stressed);
  set('badge-scorecard', d.scorecard?.offTrackCount||0, stressed);
  set('badge-systems', d.systems?.counts?.needsAttention||0, stressed);
  set('badge-vto', (d.vto?.rocks||[]).filter(scaleMine).filter(r=>r.status==='offTrack'||r.status==='atRisk').length, stressed);
}

function renderAll(d){
  document.body.setAttribute('data-state', d.state||'stressed');
  renderBadges(d);
  renderPulse(d); renderScorecard(d); renderFinance(d); renderSystems(d); renderVto(d);
  if(window.restoreCards) restoreCards();
  restoreScaleTab();
  const t = d.refreshedAt? new Date(d.refreshedAt).toLocaleString('en-US',{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';
  document.getElementById('refreshed').textContent = `REFRESHED ${t} · Scale — LRL OS`;
  document.getElementById('sc-loading').style.display='none';
  document.getElementById('sc-content').style.display='block';
}

async function load(fresh){
  try {
    const r = await fetch('/api/scale/data' + (fresh ? '?fresh=1' : ''));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    DATA = d; renderAll(d);
  } catch(e){
    document.getElementById('sc-loading').style.display='none';
    const er=document.getElementById('sc-error'); er.style.display='block'; er.textContent="Couldn't load Scale: "+e.message;
  }
}
load();
// Footer ↻ → cache-busting reload (server caches Xero/Notion data; a plain
// reload would keep serving a stale snapshot).
window.lrlFooterRefresh = () => load(true);
</script>
<script src="/shell.js"></script>
</body></html>
