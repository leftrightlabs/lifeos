<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LRL OS · Scale</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/cards.css">
<script defer src="/cards.js"></script>
<script defer src="/zone-scope.js"></script>
<style>
:root {
  --zone: var(--work); --zone-soft: var(--work-soft);
  /* --font-body / --font-display come from tokens.css (Inter, app-wide). */
  --radius: 12px; --radius-sm: 8px; --radius-xs: 5px;
}
.scale-page { max-width:920px; margin:0 auto; padding:24px 24px 100px; font-family:var(--font-body); font-size:14px; line-height:1.5; color:var(--text); }
.scotch { display:inline-block; } /* serif stretch removed — unified sans */

/* header */
.sc-head { margin-bottom:18px; }
.sc-eyebrow { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; }
.sc-title { font-weight:800; font-size:28px; line-height:1.05; letter-spacing:-.01em; color:var(--text); }
.sc-sub { font-size:12.5px; color:var(--text-2); margin-top:6px; max-width:620px; }

/* tabs */
.tab-bar { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:22px; overflow-x:auto; scrollbar-width:none; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 14px; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color .15s; font-family:var(--font-body); }
.tab-btn:hover { color:var(--text-2); }
.tab-btn.active { color:var(--zone); border-bottom-color:var(--zone); }
.tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; font-size:10px; font-weight:800; padding:0 5px; }
.tab-badge.red { background:var(--red-soft); color:var(--red); }
.tab-badge.amber { background:var(--amber-soft); color:var(--amber); }
body[data-state="calm"] .tab-badge { display:none; }

.tab-panel { display:none; }
.tab-panel.active { display:block; }
body:not([data-state]) #sc-content { display:none; }

/* state banner (PULSE) */
.statebanner { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:var(--radius); margin-bottom:22px; border:1px solid; }
.statebanner .bigicon { font-size:20px; }
.statebanner .txt h2 { font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:1px; }
.statebanner .txt p { font-size:12.5px; color:var(--text-2); }
body[data-state="stressed"] .statebanner { background:var(--amber-soft); border-color:rgba(235,180,84,.3); }
body[data-state="stressed"] .statebanner h2 { color:var(--amber); }
body[data-state="calm"] .statebanner { background:var(--green-soft); border-color:rgba(79,214,160,.25); padding:12px 16px; }
body[data-state="calm"] .statebanner h2 { color:var(--green); font-size:15px; }

/* hero / next-move */
.hero { border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px; }
body[data-state="stressed"] .hero { background:linear-gradient(135deg,var(--surface) 0%, #0E1626 100%); border-left:3px solid var(--zone); }
body[data-state="calm"] .hero { background:var(--surface); }
.hero .eyebrow { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
body[data-state="stressed"] .hero .eyebrow { color:var(--zone); }
body[data-state="calm"] .hero .eyebrow { color:var(--green); }
.hero h1 { font-family:var(--font-display); font-weight:700; font-size:21px; line-height:1.15; margin-bottom:4px; }
.hero .sub { font-size:11.5px; color:var(--text-3); margin-bottom:12px; }
.hero .why { font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:14px; }
.hero .next { font-size:12.5px; color:var(--text); background:var(--surface-2); border-left:3px solid var(--zone); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 13px; margin-bottom:14px; }
body[data-state="calm"] .hero .next { border-left-color:var(--green); }
.hero .next .lbl { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); display:block; margin-bottom:3px; }
.hero .meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.hero .meta .ie { font-size:11px; color:var(--text-3); } .hero .meta .ie b { color:var(--text-2); }

/* buttons */
.btn { font-family:var(--font-body); font-weight:600; font-size:12px; letter-spacing:.03em; padding:9px 16px; border-radius:8px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; transition:all .15s; text-decoration:none; }
.btn-primary { background:var(--zone); color:#fff; } .btn-primary:hover { filter:brightness(1.1); }
.btn-ghost { background:transparent; border-color:var(--border); color:var(--text-2); } .btn-ghost:hover { border-color:var(--text-3); color:var(--text); }
.btn-green { background:transparent; color:var(--green); border-color:var(--green); } .btn-green:hover { background:var(--green-soft); }

/* eyebrow section header */
.eyebrow-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.eyebrow { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); display:flex; align-items:center; gap:8px; }
.eyebrow.green { color:var(--green); }
.eyebrow.zone { color:var(--zone); }
.eyebrow-count { border-radius:99px; padding:2px 9px; font-size:11px; font-weight:700; }
.eyebrow-count.red { background:var(--red-soft); color:var(--red); } .eyebrow-count.amber { background:var(--amber-soft); color:var(--amber); } .eyebrow-count.green { background:var(--green-soft); color:var(--green); } .eyebrow-count.zone { background:var(--zone-soft); color:#7FA8FF; }

/* badges */
.badge { display:inline-flex; align-items:center; font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:5px; white-space:nowrap; }
.b-solid { background:var(--green-soft); color:var(--green); }
.b-on-track { background:var(--green-soft); color:var(--green); }
.b-functional { background:rgba(79,214,160,.05); color:var(--text-3); border:1px solid var(--border); }
.b-needs-rev { background:var(--amber-soft); color:var(--amber); }
.b-amber { background:var(--amber-soft); color:var(--amber); }
.b-needs-build { background:var(--zone-soft); color:#7FA8FF; }
.b-broken { background:var(--red-soft); color:var(--red); }
.b-missing { background:rgba(242,109,109,.08); color:var(--red); border:1px dashed rgba(242,109,109,.4); }
.b-urgent { background:var(--red-soft); color:var(--red); }
.b-normal { background:var(--zone-soft); color:#7FA8FF; }
.b-projected { background:var(--zone-soft); color:#7FA8FF; }
.b-leading { background:var(--zone-soft); color:#7FA8FF; border:1px solid rgba(37,99,235,.3); }
.b-lagging { background:var(--accent-soft); color:var(--accent); border:1px solid rgba(99,102,241,.3); }
.b-neutral { background:var(--surface-2); color:var(--text-3); border:1px solid var(--border); }
.b-quickwin { background:rgba(99,102,241,.13); color:#A5A8F5; }

/* issue list */
.issue-list { display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
.issue-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px; display:flex; align-items:flex-start; gap:11px; transition:border-color .15s; }
.issue-card:hover { border-color:var(--zone); }
.issue-body { flex:1; min-width:0; }
.issue-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
.issue-meta { font-size:11px; color:var(--text-3); }
.issue-tail { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.open-link { font-size:11px; font-weight:600; color:var(--zone); text-decoration:none; white-space:nowrap; } .open-link:hover { text-decoration:underline; }
.add-issue-btn { width:100%; padding:10px; background:none; border:1px dashed var(--border); border-radius:var(--radius-sm); color:var(--text-3); font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.03em; transition:all .15s; font-family:var(--font-body); }
.add-issue-btn:hover { border-color:var(--zone); color:var(--zone); }
/* ── Issues board (Current | Agenda) ── */
.sc-issbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.sc-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--text-3); font-size:11.5px; font-weight:600; cursor:pointer; letter-spacing:.02em; transition:all .15s; font-family:var(--font-body); }
.sc-chip:hover { border-color:var(--zone); color:var(--text-2); }
.sc-chip.on { border-color:var(--zone); color:var(--zone); background:rgba(124,109,255,.1); }
.sc-board { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.sc-col { background:rgba(255,255,255,.015); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; min-height:80px; transition:border-color .15s,background .15s; }
.sc-col.over { border-color:var(--zone); background:rgba(124,109,255,.06); }
.sc-col-hd { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-2); margin:2px 2px 10px; }
.sc-col-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sc-col-dot.current { background:#5b9bff; } .sc-col-dot.agenda { background:#d96fb0; }
.sc-col-n { margin-left:auto; color:var(--text-3); font-weight:600; }
.sc-col-body { display:flex; flex-direction:column; gap:8px; }
.sc-col-empty { font-size:11.5px; color:var(--text-3); padding:10px 4px; opacity:.7; }
.sc-daygrp { display:flex; flex-direction:column; gap:8px; }
.sc-daygrp + .sc-daygrp { margin-top:6px; }
.sc-dayhd { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); padding:2px; }
.sc-icard { display:flex; align-items:flex-start; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 11px; cursor:grab; transition:border-color .15s,opacity .15s; }
.sc-icard:hover { border-color:var(--zone); }
.sc-icard.dragging { opacity:.45; }
.sc-icard-main { flex:1; min-width:0; }
.sc-check { flex-shrink:0; width:18px; height:18px; margin-top:1px; border-radius:5px; border:1.5px solid var(--text-3); background:none; cursor:pointer; transition:all .15s; }
.sc-check:hover { border-color:var(--green); background:rgba(74,222,128,.12); }
.sc-iname { font-size:12.5px; font-weight:600; color:var(--text); line-height:1.35; cursor:pointer; }
.sc-iname:hover { color:var(--zone); }
.sc-imeta { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
.sc-prio { font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; cursor:pointer; border:1px solid transparent; transition:filter .15s; }
.sc-prio:hover { filter:brightness(1.2); }
.sc-prio.p-urgent { background:rgba(244,63,63,.16); color:#ff6b6b; }
.sc-prio.p-high { background:rgba(245,179,0,.16); color:#f5b300; }
.sc-prio.p-normal { background:rgba(124,109,255,.16); color:#a99bff; }
.sc-prio.p-none { background:rgba(255,255,255,.05); color:var(--text-3); }
.sc-added { font-size:10.5px; color:var(--text-3); }
.sc-move { flex-shrink:0; width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:none; color:var(--text-3); font-size:13px; cursor:pointer; transition:all .15s; }
.sc-move:hover { border-color:var(--zone); color:var(--zone); }
.sc-menu { position:absolute; z-index:9000; background:var(--surface-2,var(--surface)); border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:2px; min-width:130px; }
.sc-menu-it { text-align:left; padding:6px 9px; border-radius:6px; border:none; background:none; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-family:var(--font-body); }
.sc-menu-it:hover { background:rgba(255,255,255,.06); }
.sc-menu-it.p-urgent { color:#ff6b6b; } .sc-menu-it.p-high { color:#f5b300; } .sc-menu-it.p-normal { color:#a99bff; } .sc-menu-it.p-none { color:var(--text-3); }
@media (max-width:640px){ .sc-board { grid-template-columns:1fr; } }
/* ── Issue edit modal ── */
.sc-modal-bg { position:fixed; inset:0; background:rgba(6,8,16,.66); backdrop-filter:blur(3px); z-index:9500; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .18s; }
.sc-modal-bg.show { opacity:1; pointer-events:auto; }
.sc-modal { width:100%; max-width:460px; background:var(--surface-2,var(--surface)); border:1px solid var(--border); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.5); padding:22px; transform:translateY(10px) scale(.98); transition:transform .18s; max-height:90vh; overflow:auto; }
.sc-modal-bg.show .sc-modal { transform:none; }
.sc-modal-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.sc-modal-hd h3 { font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); margin:0; }
.sc-modal-x { background:none; border:none; color:var(--text-3); font-size:22px; line-height:1; cursor:pointer; padding:0 4px; } .sc-modal-x:hover { color:var(--text); }
.sc-field { margin-bottom:16px; }
.sc-field label { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:7px; }
.sc-input { width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13.5px; padding:10px 12px; font-family:var(--font-body); line-height:1.4; resize:vertical; }
.sc-input:focus { outline:none; border-color:var(--zone); }
.sc-seg { display:flex; gap:6px; flex-wrap:wrap; }
.sc-seg button { flex:1; min-width:64px; padding:8px 6px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-3); font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; font-family:var(--font-body); transition:all .15s; }
.sc-seg button:hover { color:var(--text-2); }
.sc-seg button.sel { border-color:var(--zone); color:var(--text); background:rgba(124,109,255,.12); }
.sc-seg button.sel.p-urgent { border-color:#ff6b6b; color:#ff6b6b; background:rgba(244,63,63,.14); }
.sc-seg button.sel.p-high { border-color:#f5b300; color:#f5b300; background:rgba(245,179,0,.14); }
.sc-seg button.sel.p-normal { border-color:#a99bff; color:#a99bff; background:rgba(124,109,255,.14); }
.sc-modal-ft { display:flex; align-items:center; gap:10px; margin-top:22px; }
.sc-modal-ft .sc-notion { font-size:11.5px; font-weight:600; color:var(--text-3); text-decoration:none; cursor:pointer; margin-right:auto; } .sc-modal-ft .sc-notion:hover { color:var(--zone); }
.sc-btn { padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:none; color:var(--text-2); font-family:var(--font-body); }
.sc-btn:hover { color:var(--text); }
.sc-btn.primary { background:var(--zone); border-color:var(--zone); color:#fff; } .sc-btn.primary:hover { filter:brightness(1.08); } .sc-btn.primary:disabled { opacity:.5; cursor:default; }

.empty-state { text-align:center; padding:28px 20px; color:var(--text-3); font-size:13px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:18px; }
.empty-state .ei { font-size:26px; margin-bottom:8px; }
.empty-state .et { font-size:14px; font-weight:600; color:var(--green); margin-bottom:5px; }
.flag-card { display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--amber); border-radius:var(--radius-sm); padding:11px 14px; }
.flag-card.red { border-left-color:var(--red); }
.flag-card .fi { font-size:15px; line-height:1.2; }
.flag-card .ft { font-size:12.5px; color:var(--text); } .flag-card .fs { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
.flag-card .fbody { flex:1; min-width:0; }
.flag-add { flex-shrink:0; width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--text-3); font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; font-family:var(--font-body); }
.flag-add:hover { border-color:var(--zone); color:var(--zone); background:rgba(124,109,255,.08); }
.flag-add:disabled { opacity:.5; cursor:default; }
.issue-name.link { cursor:pointer; } .issue-name.link:hover { color:var(--zone); text-decoration:underline; }

/* scorecard */
.scorecard { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.sc-grid { display:grid; grid-template-columns:1fr 78px 86px 110px 116px; gap:12px; align-items:center; }
.sc-head-row { padding:9px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); }
.sc-head-row .lbl { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.sc-row { padding:11px 16px; border-bottom:1px solid var(--border-soft); transition:background .15s; }
.sc-row:last-child { border-bottom:none; } .sc-row:hover { background:var(--surface-2); }
.sc-name { font-size:13px; font-weight:600; color:var(--text); } .sc-cat { font-size:10px; color:var(--text-3); margin-top:1px; }
.sc-period { font-size:11px; color:var(--text-3); }
.sc-bar { height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.sc-bar i { display:block; height:100%; border-radius:99px; }
.sc-val { font-size:13px; font-weight:800; text-align:right; white-space:nowrap; }
.sc-val .g { font-size:10px; color:var(--text-3); font-weight:400; }
.c-green { color:var(--green); } .c-amber { color:var(--amber); } .c-red { color:var(--red); } .c-unknown { color:var(--text-3); }
/* scorecard quarter selector + leading/lagging pairs */
.sc-qbar { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.sc-qtab { background:var(--surface-2); border:1px solid var(--border); border-radius:99px; color:var(--text-3); font-size:11px; font-weight:700; letter-spacing:.04em; padding:6px 14px; cursor:pointer; font-family:inherit; transition:all .15s; }
.sc-qtab:hover { color:var(--text-2); border-color:var(--text-4); }
.sc-qtab.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
.sc-qtab.future { opacity:.5; }
.sc-pairhead { display:grid; grid-template-columns:1fr 30px 1fr; gap:10px; margin-bottom:6px; }
.sc-pairhead span { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-4); }
.sc-pairhead .lag { text-align:right; }
.sc-pair { display:grid; grid-template-columns:1fr 30px 1fr; gap:10px; align-items:stretch; margin-bottom:10px; }
.sc-pair-arrow { display:flex; align-items:center; justify-content:center; color:var(--text-4); font-size:16px; }
.sc-metric { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; }
.sc-metric.l-green { border-left-color:var(--green); } .sc-metric.l-amber { border-left-color:var(--amber); } .sc-metric.l-red { border-left-color:var(--red); } .sc-metric.l-unknown { border-left-color:var(--border); }
.sc-metric-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
.sc-metric-name { font-size:13px; font-weight:700; color:var(--text); }
.sc-metric-val { font-size:13px; font-weight:800; white-space:nowrap; }
.sc-metric-val .g { font-size:10px; color:var(--text-3); font-weight:400; }
.sc-metric-foot { display:flex; align-items:center; gap:8px; }
.sc-metric-foot .sc-bar { flex:1; }
.sc-metric-pct { font-size:10px; font-weight:700; white-space:nowrap; }
.sc-metric.empty { border-style:dashed; background:none; }
.sc-metric.empty .sc-metric-name { color:var(--text-4); font-weight:600; }
.sc-metric-empty-note { font-size:11px; color:var(--text-4); font-style:italic; }
.sc-other-head { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin:20px 0 10px; }
@media(max-width:600px){ .sc-pair, .sc-pairhead { grid-template-columns:1fr; } .sc-pair-arrow { transform:rotate(90deg); height:18px; } .sc-pairhead .lag { text-align:left; } }

/* finance */
.fin-grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:14px; }
.fin-grid-2 { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:14px; }
@media (max-width:600px){ .fin-grid-3, .fin-grid-2 { grid-template-columns:repeat(2, 1fr); } }
@media (max-width:420px){ .fin-grid-3, .fin-grid-2 { grid-template-columns:1fr; } }
.fin-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
.fin-label { font-size:var(--fs-body); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; }
.fin-value { font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1; }
.fin-value.pos { color:var(--green); } .fin-value.warn { color:var(--amber); } .fin-value.neg { color:var(--red); }
/* Cash Capacity card (ported from the /index finance board) */
.cap-card { background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
.cap-label { font-size:var(--fs-caption); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--label,var(--text-2)); margin-bottom:8px; }
.cap-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.cap-months { font-size:44px; font-weight:800; color:var(--green); line-height:1; letter-spacing:-.02em; }
.cap-months span { font-size:16px; color:var(--text-3); font-weight:600; margin-left:4px; text-transform:uppercase; }
.cap-amount { font-size:20px; font-weight:800; color:var(--text); }
.cap-goal { font-size:12px; color:var(--text-3); margin-top:2px; }
.cap-bar { height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin:12px 0 6px; }
.cap-bar i { display:block; height:100%; background:var(--green); border-radius:4px; }
.cap-card.cap-warn .cap-months { color:var(--amber); } .cap-card.cap-warn .cap-bar i { background:var(--amber); }
.cap-card.cap-short .cap-months { color:var(--red); } .cap-card.cap-short .cap-bar i { background:var(--red); }
.cap-accts { font-size:12px; color:var(--text-3); margin-top:8px; padding-top:8px; border-top:1px solid var(--border-soft); }
.fin-sub { font-size:11px; color:var(--text-3); margin-top:6px; }
.fin-bar { margin-top:10px; height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.fin-bar i { display:block; height:100%; border-radius:99px; }
.fin-pct { font-size:11px; font-weight:700; margin-top:5px; }

.proj { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.proj-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.proj-title { font-size:13px; font-weight:700; color:var(--text); } .proj-subtitle { font-size:11px; color:var(--text-3); margin-top:2px; }
.proj-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.proj-item { background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; }
.proj-item .pl { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
.proj-item .pv { font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--text); }
.proj-item .ps { font-size:11px; color:var(--text-3); margin-top:2px; }
.proj-total { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.proj-total .tl { font-size:12px; color:var(--text-2); font-weight:600; } .proj-total .tsub { font-size:11px; color:var(--text-3); }
.proj-total .tv { font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--green); text-align:right; }
.proj-total .ton { font-size:11px; font-weight:700; color:var(--green); text-align:right; }
.xero-tip { font-size:11px; color:var(--text-2); background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 13px; margin-bottom:18px; border-left:3px solid var(--zone); }

.accounts { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.acc-head { display:flex; justify-content:space-between; padding:9px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); }
.acc-row { display:flex; justify-content:space-between; align-items:center; padding:9px 16px; border-bottom:1px solid var(--border-soft); font-size:13px; }
.acc-row:last-child { border-bottom:none; } .acc-row.total { background:var(--surface-2); }
.acc-name { color:var(--text-2); } .acc-name.bold { color:var(--text); font-weight:700; }
.acc-val { font-weight:700; color:var(--text); } .acc-val.pos { color:var(--green); } .acc-val.neg { color:var(--red); }
/* Inside the collapsible Bank accounts card, render flat tables (no nested-card
   chrome) — just the labeled rows + total. */
.t-card .accounts { background:transparent; border:none; border-radius:0; overflow:visible; }
.t-card .accounts + .accounts { margin-top:16px; }
.t-card .acc-head { padding-left:0; padding-right:0; background:none; }
.t-card .acc-row { padding-left:0; padding-right:0; }
.t-card .acc-row.total { background:none; }

.rev-chart { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.rev-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.rev-label { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); }
.rev-meta { font-size:11px; color:var(--text-3); }
.chart-bars { display:flex; align-items:flex-end; gap:6px; height:100px; }
.cb-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.cb-bar { width:100%; border-radius:3px 3px 0 0; min-height:2px; }
.cb-bar.above { background:var(--green); opacity:.75; }
.cb-bar.below { background:var(--zone); opacity:.45; }
.cb-bar.current { background:var(--zone); opacity:1; }
.cb-bar.proj { background:var(--green); opacity:.35; border:1px dashed rgba(79,214,160,.5); }
.cb-lbl { font-size:9px; color:var(--text-3); } .cb-lbl.current { color:#7FA8FF; font-weight:700; } .cb-lbl.proj { color:var(--green); }

/* systems */
.sys-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
.sys-stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; text-align:center; }
.sys-stat .n { font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1; margin-bottom:5px; }
.sys-stat .l { font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); }
.sys-list { display:flex; flex-direction:column; gap:7px; margin-bottom:22px; }
.sys-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 15px; display:flex; align-items:flex-start; gap:12px; border-left:3px solid transparent; transition:border-color .15s; }
.sys-card.l-red { border-left-color:var(--red); } .sys-card.l-amber { border-left-color:var(--amber); }
.sys-card:hover { border-color:var(--zone); }
.sys-body { flex:1; min-width:0; }
.sys-name-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px; }
.sys-name { font-size:13px; font-weight:600; color:var(--text); }
.sys-meta { font-size:11px; color:var(--text-3); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.sys-next { font-size:11.5px; color:var(--text-3); margin-top:6px; line-height:1.5; }
.maturity { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.md-dots { display:flex; gap:3px; } .md { width:6px; height:6px; border-radius:50%; background:var(--border); } .md.on { background:var(--green); } .md.mid { background:var(--amber); }
.md-lbl { font-size:9px; color:var(--text-3); }
.view-all-btn { width:100%; padding:10px; background:none; border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-3); font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; font-family:var(--font-body); }
.view-all-btn:hover { border-color:var(--text-3); color:var(--text-2); }

/* vto rocks */
.rocks { display:flex; flex-direction:column; gap:8px; margin-bottom:26px; }
.rock { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
.rock.l-green { border-left-color:var(--green); } .rock.l-amber { border-left-color:var(--amber); } .rock.l-red { border-left-color:var(--red); } .rock.l-gray { border-left-color:var(--border); }
.rock-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.rock-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:3px; }
.rock-link { cursor:pointer; } .rock-link:hover { color:var(--zone); text-decoration:underline; }
.rock-meta { font-size:11px; color:var(--text-3); }
.rock-prog { display:flex; align-items:center; gap:10px; }
.rock-bar { flex:1; height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; } .rock-bar i { display:block; height:100%; border-radius:99px; }
.rock-pct { font-size:11px; font-weight:700; white-space:nowrap; }
.rock-next { font-size:11px; color:var(--text-3); margin-top:8px; }
.rock.dropped { opacity:.55; }
.rock-lineage { font-size:10.5px; color:var(--text-3); margin-left:8px; font-weight:500; }
.rock-foot { display:flex; align-items:center; gap:8px; margin-top:11px; padding-top:10px; border-top:1px solid var(--border-soft,var(--border)); flex-wrap:wrap; }
.rock-disp { flex:1; min-width:130px; background:var(--surface); border:1px solid var(--border); border-radius:7px; color:var(--text-2); font-size:11.5px; font-weight:600; padding:6px 9px; font-family:var(--font-body); cursor:pointer; }
.rock-disp:focus { outline:none; border-color:var(--zone); }
.rock-carry { flex-shrink:0; background:none; border:1px solid var(--border); border-radius:7px; color:var(--text-3); font-size:11px; font-weight:700; padding:6px 11px; cursor:pointer; font-family:var(--font-body); transition:all .15s; }
.rock-carry:hover { border-color:var(--zone); color:var(--zone); }
.vq-rocks { font-size:10.5px; color:var(--text-3); margin-top:7px; font-weight:600; }

.vto-divider { height:1px; background:var(--border); margin-bottom:22px; }
.vto-plan { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.vto-col-head { display:grid; grid-template-columns:1fr 84px 84px 104px; gap:12px; padding:8px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); }
.vto-col-head .l { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.vto-group-head { padding:6px 16px; background:var(--surface-2); border-bottom:1px solid var(--border-soft); }
.vto-group-head span { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--zone); }
body[data-state="calm"] .vto-group-head span { color:var(--green); }
.vto-row { display:grid; grid-template-columns:1fr 84px 84px 104px; gap:12px; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border-soft); background:var(--surface); }
.vto-row:last-child { border-bottom:none; }
.vto-mname { font-size:13px; font-weight:600; color:var(--text); } .vto-msub { font-size:10px; color:var(--text-3); margin-top:1px; }
.vto-cell { font-size:12px; color:var(--text-3); } .vto-cell.goal { color:var(--text-2); font-weight:600; }
.vto-actual { text-align:right; font-size:13px; font-weight:800; } .vto-actual .u { font-size:10px; color:var(--text-3); font-weight:400; }

/* VTO quarterly view */
.vqa-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.vqa-amt { font-family:var(--font-display); font-size:28px; font-weight:800; color:var(--text); line-height:1; }
.vqa-amt-sub { font-size:13px; font-weight:600; color:var(--text-3); font-family:var(--font-body); }
.vqa-gap { font-size:13px; color:var(--text-3); } .vqa-gap.good { color:var(--green); }
.vqa-bar { height:18px; background:var(--surface-2); border-radius:9px; overflow:hidden; display:flex; margin-bottom:12px; }
.vqa-seg { height:100%; transition:width .6s ease; min-width:0; }
.vqa-seg.collected { background:var(--accent); }
.vqa-seg.invoiced  { background:var(--amber); opacity:.85; }
.vqa-seg.quotes    { background:var(--zone); opacity:.85; }
.vqa-seg.recur     { background:var(--green); opacity:.7; }
.vqa-legend { display:flex; gap:16px; flex-wrap:wrap; }
.vqa-leg { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2); }
.vqa-leg b { color:var(--text); font-weight:700; }
.vqa-sw { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.vqa-sw.collected { background:var(--accent); }
.vqa-sw.invoiced  { background:var(--amber); }
.vqa-sw.quotes    { background:var(--zone); }
.vqa-sw.recur     { background:var(--green); }
.vq-note { font-size:10.5px; color:var(--text-4); margin-top:8px; }
/* ── VTO Vision (EOS top half) ── */
.vis { display:flex; flex-direction:column; gap:16px; }
.vis-row { display:flex; flex-direction:column; gap:8px; }
.vis-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-3); }
.vis-vals { display:flex; flex-wrap:wrap; gap:8px; }
.vis-chip { font-size:12px; font-weight:600; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 13px; }
.vis-purpose { font-size:14px; line-height:1.6; color:var(--text-2); }
.vis-tag { font-size:13px; font-weight:700; color:var(--text); margin-top:6px; }
.vis-niche { font-size:12.5px; color:var(--text-3); margin-top:4px; }
.vis-bhag { background:linear-gradient(135deg, rgba(124,109,255,.12), rgba(124,109,255,.03)); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
.vis-bhag-val { font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text); margin-top:4px; }
.vis-bhag-sub { font-size:12px; color:var(--text-3); margin-top:2px; }
.v3-sum { font-size:13.5px; line-height:1.6; color:var(--text-2); margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
.v3-sum b { color:var(--text); }
.v3-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px 18px; }
.v3-item { font-size:12.5px; color:var(--text-2); line-height:1.45; display:flex; gap:8px; }
.v3-item::before { content:'✦'; color:var(--zone); flex-shrink:0; }
.vmk { display:flex; flex-direction:column; gap:13px; }
.vmk-row { display:grid; grid-template-columns:130px 1fr; gap:14px; align-items:start; }
.vmk-lbl { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--zone); padding-top:2px; }
.vmk-txt { font-size:12.5px; line-height:1.55; color:var(--text-2); }
.vg { display:flex; flex-direction:column; gap:13px; }
.vg-goal { display:flex; flex-direction:column; gap:6px; }
.vg-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.vg-name { font-size:13px; font-weight:600; color:var(--text); }
.vg-val { font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; } .vg-val.neg { color:var(--red); } .vg-val.muted { color:var(--text-3); font-weight:600; }
.vg-of { color:var(--text-3); font-weight:600; }
.vg-bar { height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
.vg-bar i { display:block; height:100%; border-radius:4px; transition:width .6s ease; }
.vg-goal.manual { flex-direction:row; align-items:center; gap:10px; }
.vg-check { width:17px; height:17px; flex-shrink:0; border:1.5px solid var(--text-3); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--green); }
.vg-check.done { border-color:var(--green); background:rgba(74,222,128,.14); }
@media (max-width:640px){ .v3-grid { grid-template-columns:1fr; } .vmk-row { grid-template-columns:1fr; gap:3px; } }
.sec-head-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.sc-edit-btn { background:none; border:1px solid var(--border); border-radius:7px; width:28px; height:28px; color:var(--text-3); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.sc-edit-btn:hover { border-color:var(--zone); color:var(--zone); }
.ve-list { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.ve-row { display:flex; gap:8px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px; }
.ve-row.del { opacity:.4; }
.ve-fields { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
.ve-ftag { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); }
.ve-srow { display:flex; gap:7px; flex-wrap:wrap; }
.ve-srow .sc-input { flex:1; min-width:90px; }
.ve-del { flex-shrink:0; background:none; border:none; color:var(--text-3); font-size:18px; cursor:pointer; line-height:1; padding:2px 4px; } .ve-del:hover { color:var(--red); }
.ve-add { width:100%; padding:9px; background:none; border:1px dashed var(--border); border-radius:8px; color:var(--text-3); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font-body); } .ve-add:hover { border-color:var(--zone); color:var(--zone); }
.ve-check { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-2); cursor:pointer; }
.vq-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
@media(max-width:640px){ .vq-grid { grid-template-columns:repeat(2,1fr); } }
.vq-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
.vq-card:hover { border-color:var(--text-3); }
.vq-card.sel { border-color:var(--zone); background:var(--zone-soft); }
.vq-card.future { opacity:.6; }
.vq-card-head { display:flex; align-items:center; justify-content:space-between; }
.vq-card-q { font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--text-2); }
.vq-now { font-size:8px; font-weight:800; letter-spacing:.08em; color:var(--zone); background:var(--zone-soft); padding:2px 5px; border-radius:4px; }
.vq-amt { font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text); line-height:1.1; margin-top:8px; }
.vq-goal { font-size:10.5px; color:var(--text-3); margin-top:2px; }
.vq-tbd { font-size:11px; color:var(--text-4); margin-top:10px; font-style:italic; }
.vq-links { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
.vq-link { flex:1; min-width:140px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-2); font-size:12px; font-weight:700; padding:11px; cursor:pointer; font-family:inherit; transition:all .15s; }
.vq-link:hover { border-color:var(--zone); color:var(--text); }

.empty-line { font-size:12px; color:var(--text-3); padding:14px 4px; }
.unavail { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; color:var(--text-3); font-size:12.5px; }
.unavail b { color:var(--text-2); display:block; margin-bottom:4px; font-size:13px; }

#sc-loading { padding:60px 0; text-align:center; color:var(--text-3); font-size:13px; }
#sc-error { display:none; background:var(--red-soft); border:1px solid rgba(242,109,109,.25); color:var(--red); border-radius:var(--radius); padding:14px 18px; font-size:13px; margin-bottom:18px; }
.refreshed { text-align:center; padding:20px; font-size:11px; color:var(--text-4); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; z-index:999; transition:transform .25s,opacity .25s; opacity:0; pointer-events:none; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

@media(max-width:720px){
  .sys-summary { grid-template-columns:repeat(2,1fr); }
  .proj-grid { grid-template-columns:1fr; }
  .sc-grid { grid-template-columns:1fr auto; gap:6px 10px; }
  .sc-head-row { display:none; }
  .sc-row .sc-period, .sc-row .sc-type-cell { display:none; }
  .sc-row .sc-bar-cell { grid-column:1 / -1; }
  .vto-col-head { display:none; }

</head><body>
