<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0f1e;
      color: #f5f5f7;
      font-family: 'Montserrat', 'Sweet Sans Pro', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .center {
      text-align: center;
      padding: 0 1.5rem;
    }

    h1 {
      font-family: 'Scotch Display', 'Playfair Display', Georgia, serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 700;
      color: #f5f5f7;
      line-height: 1;
      transform: scaleY(1.2);
      transform-origin: top left;
      display: inline-block;
    }

    .sub {
      margin-top: 1.75rem;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      font-weight: 300;
      color: #a7c140;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .version {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      font-size: 0.65rem;
      color: rgba(245, 245, 247, 0.3);
      letter-spacing: 0.1em;
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>LifeOS</h1>
    <p class="sub">Coming online</p>
  </div>
  <span class="version">v: day-1</span>
</body>
</html>
