<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      background-color: #0a0f1e;
      color: #f5f5f7;
      font-family: 'Montserrat', sans-serif;
      padding: 2rem 1.5rem 4rem;
      line-height: 1.4;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 2.5rem;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.75rem, 6vw, 4.5rem);
      font-weight: 700;
      color: #f5f5f7;
      line-height: 1;
      transform: scaleY(1.2);
      transform-origin: top left;
      display: inline-block;
    }

    header .sub {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      font-weight: 300;
      color: #a7c140;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }

    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background-color: #131a30;
      border: 1px solid rgba(245, 245, 247, 0.06);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .card h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card h2 .count {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      color: #a7c140;
      background-color: rgba(167, 193, 64, 0.12);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.08em;
    }

    ul { list-style: none; }

    li {
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(245, 245, 247, 0.05);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    li:last-child { border-bottom: none; }

    li a {
      color: #f5f5f7;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
    }

    li a:hover { color: #a7c140; }

    .meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.7rem;
      color: rgba(245, 245, 247, 0.5);
      letter-spacing: 0.05em;
    }

    .meta .status, .meta .due, .meta .priority, .meta .loc { display: inline-flex; align-items: center; gap: 0.3rem; }

    .meta .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background-color: #a7c140;
    }

    .when {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      color: #a7c140;
      letter-spacing: 0.05em;
    }

    .sender {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      color: #a7c140;
      letter-spacing: 0.02em;
    }

    .snippet {
      color: rgba(245, 245, 247, 0.55);
      font-size: 0.8rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty { color: rgba(245, 245, 247, 0.4); font-size: 0.85rem; padding: 0.5rem 0; }
    .err { color: #ff6b6b; font-size: 0.85rem; padding: 0.5rem 0; }
    .loading { color: rgba(245, 245, 247, 0.4); font-size: 0.85rem; padding: 0.5rem 0; }

    .version {
      position: fixed;
      bottom: 0.75rem;
      right: 0.75rem;
      font-size: 0.65rem;
      color: rgba(245, 245, 247, 0.25);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <header>
    <h1>LifeOS</h1>
    <p class="sub">My Day</p>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Today <span class="count" id="cal-count">—</span></h2>
      <ul id="cal-list"><li class="loading">loading…</li></ul>
    </section>
    <section class="card">
      <h2>Inbox <span class="count" id="gmail-count">—</span></h2>
      <ul id="gmail-list"><li class="loading">loading…</li></ul>
    </section>
    <section class="card">
      <h2>Work <span class="count" id="work-count">—</span></h2>
      <ul id="work-list"><li class="loading">loading…</li></ul>
    </section>
    <section class="card">
      <h2>Life <span class="count" id="life-count">—</span></h2>
      <ul id="life-list"><li class="loading">loading…</li></ul>
    </section>
  </div>

  <span class="version">v: day-4</span>

  <script>
    const TZ = 'America/Chicago';

    function fmtDue(iso) {
      if (!iso) return null;
      const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function fmtTime(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderTasks(listEl, countEl, tasks) {
      countEl.textContent = tasks.length;
      if (!tasks.length) {
        listEl.innerHTML = '<li class="empty">nothing on the list</li>';
        return;
      }
      listEl.innerHTML = tasks.map(t => {
        const due = fmtDue(t.due);
        const meta = [
          t.status ? `<span class="status"><span class="dot"></span>${escapeHtml(t.status)}</span>` : '',
          due ? `<span class="due">${due}</span>` : '',
          t.priority ? `<span class="priority">${escapeHtml(t.priority)}</span>` : '',
        ].filter(Boolean).join('');
        return `<li>
          <a href="${t.url}" target="_blank" rel="noopener">${escapeHtml(t.title)}</a>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
        </li>`;
      }).join('');
    }

    function fmtRelative(ms) {
      if (!ms) return '';
      const diff = Date.now() - ms;
      const min = Math.floor(diff / 60000);
      if (min < 60) return `${min}m`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h`;
      const day = Math.floor(hr / 24);
      return `${day}d`;
    }

    function renderThreads(listEl, countEl, threads) {
      countEl.textContent = threads.length;
      if (!threads.length) {
        listEl.innerHTML = '<li class="empty">inbox zero</li>';
        return;
      }
      listEl.innerHTML = threads.map(t => {
        const when = fmtRelative(t.internalDate);
        const meta = `<div class="meta"><span class="sender">${escapeHtml(t.fromName || t.fromEmail)}</span>${when ? `<span>${when}</span>` : ''}</div>`;
        return `<li>
          ${meta}
          <a href="${t.url}" target="_blank" rel="noopener">${escapeHtml(t.subject)}</a>
          ${t.snippet ? `<div class="snippet">${escapeHtml(t.snippet)}</div>` : ''}
        </li>`;
      }).join('');
    }

    function renderEvents(listEl, countEl, events) {
      countEl.textContent = events.length;
      if (!events.length) {
        listEl.innerHTML = '<li class="empty">no events today</li>';
        return;
      }
      listEl.innerHTML = events.map(e => {
        const when = e.allDay ? 'All day' : `${fmtTime(e.start)}${e.end ? ' – ' + fmtTime(e.end) : ''}`;
        const meta = e.location ? `<div class="meta"><span class="loc">${escapeHtml(e.location)}</span></div>` : '';
        return `<li>
          <div class="when">${when}</div>
          <a href="${e.url}" target="_blank" rel="noopener">${escapeHtml(e.title)}</a>
          ${meta}
        </li>`;
      }).join('');
    }

    async function load(path, listEl, countEl, kind) {
      try {
        const res = await fetch(path);
        const data = await res.json();
        if (data.error) {
          listEl.innerHTML = `<li class="err">${escapeHtml(data.error)}</li>`;
          countEl.textContent = '!';
          return;
        }
        if (kind === 'events') renderEvents(listEl, countEl, data.events || []);
        else if (kind === 'threads') renderThreads(listEl, countEl, data.threads || []);
        else renderTasks(listEl, countEl, data.tasks || []);
      } catch (err) {
        listEl.innerHTML = `<li class="err">${escapeHtml(err.message)}</li>`;
        countEl.textContent = '!';
      }
    }

    load('/api/calendar/today', document.getElementById('cal-list'), document.getElementById('cal-count'), 'events');
    load('/api/comms/gmail', document.getElementById('gmail-list'), document.getElementById('gmail-count'), 'threads');
    load('/api/tasks/work-myday', document.getElementById('work-list'), document.getElementById('work-count'));
    load('/api/tasks/life-myday', document.getElementById('life-list'), document.getElementById('life-count'));
  </script>
</body>
</html>
