<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LRL OS · LEGO</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/cards.css">
<script defer src="/cards.js"></script>
<script defer src="/zone-scope.js"></script>
<style>
:root {
  --zone: var(--personal); --zone-soft: var(--personal-soft);
  /* Map legacy /index tokens onto the shared zone token system. */
  --navy: var(--text);
  --navy-dim: var(--text-3);
  --navy-faint: var(--border-soft);
  --lime: var(--green);
  --edge-rgb: 94,107,132;
}
.lego-page { max-width: 1000px; margin: 0 auto; padding: 24px 28px 80px; }
.page-sub { font-size: 13px; color: var(--text-3); margin: 8px 0 20px; }
@media (max-width: 600px) { .lego-page { padding: 20px 16px 70px; } }

/* KPI grid — responsive (2-up mobile, more where it fits) */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 12px; padding: 15px 17px; }
.kpi-label { font-size: var(--fs-caption); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--label, var(--text-2)); margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -.01em; line-height: 1.1; }
.kpi-change { font-size: 12px; color: var(--text-3); margin-top: 5px; }

/* Progress bars (collection breakdown) */
.chapter-progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.chapter-progress-bar { height: 100%; background: var(--zone, var(--accent)); border-radius: 99px; }

/* Panels inside a section card read as cells */
.t-card .kpi-card { background: var(--surface-2); }
.lego-status { font-size: 13px; color: var(--text-3); padding: 22px 4px; text-align: center; }
</style>
<script src="/sample-data.js"></script>
<script src="/privacy.js"></script>
</head><body>
<div id="lrl-shell"></div>

<div class="lego-page">
  <h1 class="page-title">LEGO</h1>
  <div class="page-sub">Live from your Notion LEGO databases — collection, builds &amp; conventions.</div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Active MOCs</div><div class="kpi-value"><span id="lego-active">—</span></div><div class="kpi-change" id="lego-active-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">Sets Owned</div><div class="kpi-value"><span id="lego-sets">—</span></div><div class="kpi-change" id="lego-sets-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">Collection Value</div><div class="kpi-value"><span id="lego-value">—</span></div><div class="kpi-change" id="lego-value-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">Total Pieces</div><div class="kpi-value"><span id="lego-pieces">—</span></div><div class="kpi-change" id="lego-pieces-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">MOCs Built</div><div class="kpi-value"><span id="lego-built">—</span></div><div class="kpi-change" id="lego-built-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">Awards</div><div class="kpi-value"><span id="lego-awards">—</span></div><div class="kpi-change" id="lego-awards-sub">loading…</div></div>
    <div class="kpi-card"><div class="kpi-label">Next Convention</div><div class="kpi-value"><span id="lego-con">—</span></div><div class="kpi-change" id="lego-con-sub">loading…</div></div>
  </div>
  <div id="lego-sections" class="card-stack"></div>
</div>

<a href="/" class="fab" title="Back to Today">⚡</a>

<script>
function tCard(title, bodyHtml, key, rightHtml){
  return '<div class="t-card" data-persist-key="'+key+'"><div class="sec-head"><div class="card-toggle" onclick="toggleCard(this)"><span class="chev">▾</span><div class="sec-title">'+title+'</div></div>'+(rightHtml||'')+'</div><div class="t-body">'+bodyHtml+'</div></div>';
}

function maybeLoadLego(){
  fetch('/api/lego/summary').then(r=>r.json()).then(d=>{
    const money=(n)=>(n<0?'-$':'$')+Math.abs(Math.round(n||0)).toLocaleString('en-US');
    const numf=(n)=>Math.round(n||0).toLocaleString('en-US');
    const set=(id,val,sub)=>{ const v=document.getElementById(id); const s=document.getElementById(id+'-sub'); if(v&&val!=null)v.textContent=val; if(s&&sub!=null)s.textContent=sub; };
    const IDS=['lego-active','lego-sets','lego-value','lego-pieces','lego-built','lego-awards','lego-con'];
    const sectionsEl=document.getElementById('lego-sections');
    if (d.error){ IDS.forEach(id=>set(id,'—','')); set('lego-active','—','Load failed'); set('lego-sets','—',String(d.error).slice(0,60)); if(sectionsEl)sectionsEl.innerHTML=''; return; }
    if (!d.configured){ IDS.forEach(id=>set(id,'—','—')); set('lego-sets','—','Notion not connected'); if(sectionsEl)sectionsEl.innerHTML=''; return; }
    const s=d.sets||{}, m=d.mocs||{};
    set('lego-active', String(m.active||0), m.activeName ? (m.activeName+' in progress') : (m.active ? 'currently building' : 'nothing on the bench'));
    set('lego-sets', numf(s.owned), s.wishlist ? ('+ '+s.wishlist+' on wishlist') : 'in your collection');
    set('lego-value', money(s.collectionValue), s.profit ? ((s.profit>=0?'+':'')+money(s.profit)+' vs paid') : 'current market value');
    set('lego-pieces', numf(s.totalPieces), 'across owned sets');
    set('lego-built', numf(m.built), 'of '+numf(m.total)+' total MOCs');
    set('lego-awards', String(m.awards||0), m.awards===1 ? 'convention win' : 'convention wins');
    const c=d.nextConvention;
    if (c){ const dt=c.date ? new Date(c.date.length<=10 ? c.date+'T12:00:00' : c.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''; set('lego-con', c.name, [dt, c.location].filter(Boolean).join(' · ') || 'upcoming'); }
    else { set('lego-con','—','none scheduled'); }
    renderLegoSections(d);
  }).catch(e=>{ console.error('maybeLoadLego', e); const el=document.getElementById('lego-sections'); if(el) el.innerHTML='<div class="lego-status">Couldn\'t load LEGO data.</div>'; });
}

function renderLegoSections(d){
  const host=document.getElementById('lego-sections'); if(!host) return;
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money=(n)=>(n<0?'-$':'$')+Math.abs(Math.round(n||0)).toLocaleString('en-US');
  const numf=(n)=>Math.round(n||0).toLocaleString('en-US');
  const fdate=(s)=> s? new Date(s.length<=10? s+'T12:00:00': s).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';

  // Build pipeline — MOCs grouped by status
  const ORDER=['Planned','Building','Display Ready','On Loan','Gifted','Digital Render','Disassembled','Unsorted'];
  const pipe=d.pipeline||{};
  const cols=ORDER.filter(st=>pipe[st]&&pipe[st].length).map(st=>{
    const items=pipe[st];
    const cards=items.slice(0,8).map(it=>`<div style="background:rgba(var(--edge-rgb),0.08);border:1px solid var(--navy-faint);border-radius:6px;padding:7px 9px;margin-bottom:6px"><div style="font-size:12.5px;color:var(--navy);font-weight:600">${esc(it.name)}</div><div style="font-size:10.5px;color:var(--navy-dim);margin-top:2px">${[it.category,it.parts?numf(it.parts)+' pcs':null,it.award?'🏆':null].filter(Boolean).join(' · ')||'&nbsp;'}</div></div>`).join('');
    const more=items.length>8?`<div style="font-size:10.5px;color:var(--navy-dim)">+${items.length-8} more</div>`:'';
    return `<div class="kpi-card" style="min-width:170px"><div style="display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-dim);font-weight:700;margin-bottom:9px"><span>${esc(st)}</span><span>${items.length}</span></div>${cards}${more}</div>`;
  }).join('');
  const pipeline=cols?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:start">${cols}</div>`:'';

  // Collection breakdown — bars by theme + status
  const bars=(arr)=>{ const max=Math.max(1,...arr.map(x=>x.count)); return arr.map(x=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:var(--navy)">${esc(x.name)}</span><span style="color:var(--navy-dim)">${x.count}${x.value?' · '+money(x.value):''}</span></div><div class="chapter-progress"><div class="chapter-progress-bar" style="width:${Math.round(x.count/max*100)}%"></div></div></div>`).join(''); };
  const col=d.collection||{};
  const hasBreak=(col.byTheme&&col.byTheme.length)||(col.byStatus&&col.byStatus.length);
  const breakdown=hasBreak?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px"><div class="kpi-card"><div style="font-size:12px;color:var(--navy-dim);font-weight:700;margin-bottom:10px">By Theme</div>${bars(col.byTheme||[])}</div><div class="kpi-card"><div style="font-size:12px;color:var(--navy-dim);font-weight:700;margin-bottom:10px">By Status</div>${bars(col.byStatus||[])}</div></div>`:'';

  // MOC showcase — image gallery
  const gal=d.mocGallery||[];
  const gallery=gal.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">${gal.map(it=>`<div class="kpi-card" style="padding:0;overflow:hidden"><div style="aspect-ratio:4/3;background:rgba(var(--edge-rgb),0.1)"><img src="${esc(it.image)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentNode.style.display='none'"></div><div style="padding:8px 10px"><div style="font-size:12px;color:var(--navy);font-weight:600">${esc(it.name)}</div><div style="font-size:10.5px;color:var(--navy-dim);margin-top:2px">${[it.category,it.award?'🏆 '+esc(it.award):null].filter(Boolean).join(' · ')||'&nbsp;'}</div></div></div>`).join('')}</div>`:'';

  // LEGO projects (Area = 👻 LEGO)
  const projs=d.projects; let projects='';
  if(projs&&projs.length){
    const chip=(st)=>st?`<span style="font-size:10px;color:${(st==='Active'||st==='Ongoing')?'var(--lime)':'var(--navy-dim)'};border:1px solid var(--navy-faint);border-radius:20px;padding:1px 8px;white-space:nowrap">${esc(st)}</span>`:'';
    projects=`${projs.slice(0,12).map((p,i,a)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;${i<a.length-1?'border-bottom:1px solid var(--navy-faint)':''}"><a href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--navy);text-decoration:none;flex:1">${esc(p.name)}</a>${chip(p.status)}${p.deadline?`<span style="font-size:11px;color:var(--navy-dim)">${fdate(p.deadline)}</span>`:''}</div>`).join('')}`;
  }

  let h='';
  if (pipeline)  h += tCard('🛠️ Build Pipeline', pipeline, 'lego-pipeline');
  if (breakdown) h += tCard('📊 Collection Breakdown', breakdown, 'lego-collection');
  if (gallery)   h += tCard('🏆 MOC Showcase', gallery, 'lego-showcase');
  if (projects)  h += tCard('📁 LEGO Projects', projects, 'lego-projects');
  host.innerHTML = h || '<div class="lego-status">No LEGO sections to show yet.</div>';
  if (window.restoreCards) restoreCards();
}

maybeLoadLego();
</script>
<script src="/shell.js"></script>
</body></html>
